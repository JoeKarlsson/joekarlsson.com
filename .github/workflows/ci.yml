name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx markdownlint-cli2 "src/content/blog/**/*.md"

  spelling:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cspell "src/content/blog/**/*.md" --no-progress

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  images:
    name: Image Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: chmod +x scripts/validate-images.sh && bash scripts/validate-images.sh

  links:
    name: Internal Link Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir dist/ --config .lychee.toml dist/
          fail: true

  feeds:
    name: RSS & Sitemap Validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - run: sudo apt-get install -y libxml2-utils
      - run: chmod +x scripts/validate-feeds.sh && bash scripts/validate-feeds.sh

  accessibility:
    name: Accessibility (Pa11y)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - run: npx serve dist -l 4321 &
      - run: sleep 3
      - run: npx pa11y-ci --config .pa11yci.json

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - run: mkdir -p .lighthouseci && npx lhci autorun
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: warn

  caddyfile:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: chmod +x scripts/validate-caddyfile.sh && bash scripts/validate-caddyfile.sh

  build-output:
    name: Build Output Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - run: npx vitest run tests/build-output.test.ts

  content:
    name: Content Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/content-schema.test.ts

  unused:
    name: Unused Dependencies & Exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx knip

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    name: Failure Notification
    runs-on: ubuntu-latest
    if: failure()
    needs:
      - build
      - markdown
      - spelling
      - lint
      - images
      - links
      - feeds
      - accessibility
      - lighthouse
      - caddyfile
      - build-output
      - content
      - unused
      - audit
      - e2e
    steps:
      - name: Send ntfy push notification
        if: vars.NTFY_TOPIC != ''
        run: |
          curl -s \
            -H "Title: CI Failed: joekarlsson.com" \
            -H "Priority: high" \
            -H "Tags: x,ci" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "CI pipeline failed on ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Click to view details." \
            "${{ vars.NTFY_URL }}/${{ vars.NTFY_TOPIC }}"
