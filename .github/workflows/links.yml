name: External Link Check

on:
  schedule:
    - cron: '0 4 * * 0' # Sunday at 4am UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  links:
    name: Check External Links
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: --no-progress --root-dir dist/ --config .lychee.toml dist/
          fail: false
      - uses: peter-evans/create-issue-from-file@v5
        if: steps.lychee.outputs.exit_code != 0
        with:
          title: 'Broken external links detected'
          content-filepath: ./lychee/out.md
          labels: maintenance
          update-existing: true
      - name: Close resolved link issues
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label maintenance --json number,title \
            --jq '.[] | select(.title == "Broken external links detected") | .number' \
            | xargs -r -I{} gh issue close {} --comment "All external links are now passing. Closing automatically."
