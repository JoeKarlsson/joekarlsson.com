name: Dependency Health

on:
  schedule:
    - cron: '0 5 * * 1' # Monday at 5am UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for outdated packages
        id: outdated
        run: |
          set +e
          npm outdated --long > /tmp/outdated-raw.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/outdated-raw.txt
          if [ $EXIT_CODE -ne 0 ]; then
            echo "has_outdated=true" >> "$GITHUB_OUTPUT"
            cat > /tmp/outdated.md <<'HEADER'
          ## Outdated Dependencies

          The following npm packages have newer versions available:

          ```
          HEADER
            cat /tmp/outdated-raw.txt >> /tmp/outdated.md
            cat >> /tmp/outdated.md <<'FOOTER'
          ```

          ### How to update

          **Patch/minor updates (safe):**
          ```bash
          npm update
          ```

          **Major updates (review changelogs first):**
          ```bash
          npm outdated  # review what changed
          npm install <package>@latest  # update one at a time
          ```

          Run `npm test` after updating to verify nothing broke.
          FOOTER
          else
            echo "has_outdated=false" >> "$GITHUB_OUTPUT"
          fi
      # create-issue-from-file has no update-existing input - it only takes
      # issue-number - so look the open issue up ourselves. Passing an empty
      # value creates a new issue, which is what we want when none is open.
      - name: Find existing outdated issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBERS=$(gh issue list --state open --label dependencies --json number,title \
            --jq '[.[] | select(.title == "Outdated npm dependencies detected") | .number] | sort | .[]')
          KEEP=$(echo "$NUMBERS" | head -1)
          echo "number=$KEEP" >> "$GITHUB_OUTPUT"
          # Anything beyond the oldest is a duplicate from before this fix
          echo "$NUMBERS" | tail -n +2 | xargs -r -I{} \
            gh issue close {} --comment "Duplicate of #$KEEP, which this workflow now updates in place."
      - uses: peter-evans/create-issue-from-file@v5
        if: steps.outdated.outputs.has_outdated == 'true'
        with:
          title: 'Outdated npm dependencies detected'
          content-filepath: /tmp/outdated.md
          labels: dependencies,maintenance
          issue-number: ${{ steps.existing.outputs.number }}
      - name: Close resolved dependency issues
        if: steps.outdated.outputs.has_outdated == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label dependencies --json number,title \
            --jq '.[] | select(.title == "Outdated npm dependencies detected") | .number' \
            | xargs -r -I{} gh issue close {} --comment "All dependencies are now up to date. Closing automatically."

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for vulnerabilities
        id: audit
        run: |
          set +e
          npm audit --omit=dev > /tmp/audit-raw.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/audit-raw.txt
          if [ $EXIT_CODE -ne 0 ]; then
            echo "has_vulns=true" >> "$GITHUB_OUTPUT"
            cat > /tmp/audit.md <<'HEADER'
          ## Security Vulnerabilities

          Production dependencies have known vulnerabilities:

          ```
          HEADER
            cat /tmp/audit-raw.txt >> /tmp/audit.md
            cat >> /tmp/audit.md <<'FOOTER'
          ```

          Run `npm audit` locally for details and `npm audit fix` to auto-fix where possible.
          FOOTER
          else
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Find existing audit issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBERS=$(gh issue list --state open --label security --json number,title \
            --jq '[.[] | select(.title == "npm security vulnerabilities detected") | .number] | sort | .[]')
          KEEP=$(echo "$NUMBERS" | head -1)
          echo "number=$KEEP" >> "$GITHUB_OUTPUT"
          echo "$NUMBERS" | tail -n +2 | xargs -r -I{} \
            gh issue close {} --comment "Duplicate of #$KEEP, which this workflow now updates in place."
      - uses: peter-evans/create-issue-from-file@v5
        if: steps.audit.outputs.has_vulns == 'true'
        with:
          title: 'npm security vulnerabilities detected'
          content-filepath: /tmp/audit.md
          labels: security,maintenance
          issue-number: ${{ steps.existing.outputs.number }}
      - name: Close resolved security issues
        if: steps.audit.outputs.has_vulns == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label security --json number,title \
            --jq '.[] | select(.title == "npm security vulnerabilities detected") | .number' \
            | xargs -r -I{} gh issue close {} --comment "No security vulnerabilities detected. Closing automatically."
