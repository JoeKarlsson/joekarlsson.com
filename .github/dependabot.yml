# Weekly dependency updates, grouped so each ecosystem opens one PR instead of one per package.
# Security updates for known vulnerabilities come through regardless of the schedule.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # TypeScript 7 (the Go rewrite) breaks the toolchain: typescript-eslint and
      # @astrojs/check (via @volar) cap their peer range below 7, so npm ci fails.
      # Drop this once both support 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
