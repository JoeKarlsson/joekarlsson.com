# Weekly dependency updates, grouped so each ecosystem opens one PR instead of one per package.
# Security updates for known vulnerabilities come through regardless of the schedule.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
