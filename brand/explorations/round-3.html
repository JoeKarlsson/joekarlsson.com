<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Options Three</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff4fd8; --chrome: #141414; --line: #2a2a2a; --muted: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a0a; color: #fff; font: 16px/1.5 "Hanken Grotesk", system-ui, sans-serif; padding: 40px 16px 80px; }
  header, main { max-width: 1180px; margin: 0 auto; }
  header h1 { font: 400 clamp(40px, 7vw, 72px)/1 Anton, sans-serif; text-transform: uppercase; margin: 0 0 8px; }
  header h1 b { color: var(--pink); font-weight: 400; }
  header p { color: var(--muted); max-width: 62ch; margin: 0 0 32px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 24px; }

  .card { background: var(--chrome); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .card h2 { font: 900 15px/1 "Hanken Grotesk", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0; padding: 16px 18px 6px; }
  .card h2 span { color: var(--pink); margin-right: 8px; }
  .card h2 em { font-style: normal; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 8px; }
  .card p { margin: 0; padding: 0 18px 14px; color: var(--muted); font-size: 14px; }
  .stage { display: grid; grid-template-columns: 2fr 1fr; }
  .panel { display: grid; place-items: center; min-height: 220px; padding: 20px; overflow: hidden; }
  .panel.big { font-size: 56px; }
  .panel.small { font-size: 26px; }
  .tabs { display: flex; align-items: center; gap: 18px; padding: 12px 18px; background: #222; border-top: 1px solid var(--line); font: 400 12px "Hanken Grotesk", sans-serif; color: var(--muted); }
  .tab { display: flex; align-items: center; gap: 8px; background: #333; color: #ddd; border-radius: 6px 6px 0 0; padding: 6px 12px 6px 8px; }
  .icon { display: grid; place-items: center; background: #000; border-radius: 18%; overflow: hidden; flex: none; }

  .dark  { --bg: #000; --fg: #fff; --accent: var(--pink); --on-accent: #000; background: var(--bg); color: var(--fg); }
  .light { --bg: var(--pink); --fg: #000; --accent: #000; --on-accent: var(--pink); background: var(--bg); color: var(--fg); }
  svg { display: block; overflow: visible; }

  /* Site header replica (Header.astro): paper bar, Anton stickers, logo in the home slot */
  .headrow { background: #000; padding: 22px 12px; display: flex; justify-content: center; overflow: hidden; border-top: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: .19em; background: #ededed; color: #000; border-radius: .67em; padding: .29em; font: 400 14px/1 Anton, sans-serif; text-transform: uppercase; white-space: nowrap; }
  .bar > span { padding: .38em .48em; border-radius: .43em; }
  .bar > .on { background: var(--pink); }
  .bar > .pause { background: #000; color: #ededed; padding: .38em; display: grid; }
  .bar > .logo { padding: .32em .5em; display: grid; place-items: center; text-transform: none; line-height: 1; }

  /* 14 line boil (HTML version from batch two) */
  .boil { font: 400 1.7em/1 "Permanent Marker", cursive; color: var(--accent); filter: url(#boil); transform: rotate(-3deg); display: inline-block; }

  /* 15 twinkle doodles */
  .twinkle { position: relative; font: 400 .78em/1 "Permanent Marker", cursive; white-space: nowrap; padding: .5em .6em; }
  .twinkle > svg { position: absolute; width: .55em; fill: var(--accent); animation: twinkle 1.8s ease-in-out infinite; }
  .twinkle .s1 { left: -.1em; top: .05em; }
  .twinkle .s2 { right: -.05em; top: -.05em; width: .4em; animation-delay: .6s; }
  .twinkle .s3 { right: .6em; bottom: .05em; width: .32em; animation-delay: 1.2s; }
  .twinkle .boiled { display: inline-block; filter: url(#boil); }
  @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(.4) rotate(45deg); } }

  /* sparkles inside SVG marks */
  .twk { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; fill: var(--accent); }
  .twk.gentle { animation-name: twinkle-gentle; }
  @keyframes twinkle-gentle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(.75) rotate(30deg); } }
  .orbit { transform-origin: 60px 55px; animation: spin 7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  @media (max-width: 560px) { .stage { grid-template-columns: 1fr; } .panel.big { font-size: 44px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1">
      <animate attributeName="seed" values="1;4;8" dur="0.36s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="4"/>
  </filter>
  <filter id="boil2">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11">
      <animate attributeName="seed" values="11;15;19" dur="0.36s" begin="0.12s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="4"/>
  </filter>
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="3"/>
  </filter>
  <clipPath id="jkclip"><text x="60" y="100" text-anchor="middle" font-family="Anton" font-size="104">JK</text></clipPath>
</svg>

<header>
  <h1>Logo options, <b>batch three</b></h1>
  <p>Riffs on 14 (line boil), 15 (sparkles) and 19 (the JK outline, but easier to read). Those three are at the top for comparison, then ten new ones, 21 to 30.</p>
</header>
<main id="grid"></main>

<script>
const SPARKLE = "M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0Z";
const sparkle = cls => `<svg class="${cls}" viewBox="0 0 20 20"><path d="${SPARKLE}"/></svg>`;
// A twinkling sparkle centred on (cx, cy) with radius r, for use inside an SVG mark
const sp = (cx, cy, r, delay = 0, extraClass = "") =>
  `<g transform="translate(${cx - r} ${cy - r}) scale(${r / 10})"><path class="twk ${extraClass}" style="animation-delay:${delay}s" d="${SPARKLE}"/></g>`;

const JK = (attrs, size = 104, y = 100) => `<text x="60" y="${y}" text-anchor="middle" font-family="Anton" font-size="${size}" ${attrs}>JK</text>`;
const markerJK = attrs => `<text x="60" y="88" text-anchor="middle" font-family="Permanent Marker" font-size="84" ${attrs}>JK</text>`;
const zig = (step, top = 6, bottom = 104) => {
  let d = `M-10 ${top}`;
  for (let x = -10, up = true; x < 130; x += step, up = !up) d += ` L${x + step * 1.5} ${up ? bottom : top}`;
  return d;
};

const hatch19 = `<svg viewBox="0 0 120 110" width="1.9em">
  <g clip-path="url(#jkclip)" filter="url(#rough)"><path d="${zig(6)}" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linejoin="round"/></g>
  ${JK('fill="none" stroke="var(--fg)" stroke-width="2.5" filter="url(#boil)"')}
</svg>`;

const rays = [...Array(14)].map((_, i) => {
  const a = (i / 14) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
  return `M${60 + c * 50} ${55 + s * 50} L${60 + c * (i % 2 ? 66 : 76)} ${55 + s * (i % 2 ? 66 : 76)}`;
}).join(" ");

const jkHand = (withSparkle = true) => `<svg viewBox="0 0 100 110" width="1.7em">
  <g filter="url(#boil)" fill="none" stroke="var(--fg)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 44 V88 Q38 104 20 101"/><path d="M62 12 V102 M92 46 L64 74 M72 66 L94 102"/>
  </g>
  ${withSparkle ? sp(38, 20, 15, 0, "gentle") : `<circle cx="38" cy="22" r="8" fill="var(--accent)"/>`}
</svg>`;

const options = [
  { n: "14", tag: "batch two", name: "Line boil", note: "Reference. Marker JK that jitters like hand-drawn frames.",
    mark: `<span class="boil">JK</span>`, icon: `<span class="boil">JK</span>`, iconScale: .38, headSize: 13 },
  { n: "15", tag: "batch two", name: "Twinkle doodles", note: "Reference. Marker name with sparkles pulsing around it.",
    mark: `<span class="twinkle">${sparkle("s1")}Joe Karlsson${sparkle("s2")}${sparkle("s3")}</span>`,
    icon: `<span class="twinkle" style="font-size:1.1em;padding:.3em .35em">${sparkle("s2")}jk</span>`, iconScale: .5, headSize: 24 },
  { n: "19", tag: "batch two", name: "Colored in", note: "Reference. Shaky JK outline with dense crayon zigzags (the hard-to-read one).",
    mark: hatch19, icon: hatch19, iconScale: .5, headSize: 14 },

  { n: "21", tag: "14 + 15", name: "Boil and sparkle", note: "The boiling marker JK with three sparkles twinkling around it.",
    mark: `<svg viewBox="0 0 120 110" width="2em">${markerJK('fill="var(--accent)" filter="url(#boil)"')}${sp(8, 14, 10)}${sp(114, 10, 7, .6)}${sp(110, 96, 6, 1.2)}</svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em">${markerJK('fill="var(--accent)" filter="url(#boil)"')}${sp(110, 10, 12)}</svg>`, iconScale: 1, headSize: 14 },
  { n: "22", tag: "19, readable", name: "Off-register", note: "Solid pink Anton JK, with the boiling outline knocked slightly off to one side like a misprint. Reads instantly.",
    mark: `<svg viewBox="0 0 120 110" width="1.9em">${JK('fill="var(--accent)"')}${JK('fill="none" stroke="var(--fg)" stroke-width="3" transform="translate(-5 -4)" filter="url(#boil)"')}</svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em">${JK('fill="var(--accent)"')}${JK('fill="none" stroke="var(--fg)" stroke-width="4" transform="translate(-5 -4)" filter="url(#boil)"')}</svg>`, iconScale: 1, headSize: 14 },
  { n: "23", tag: "19, readable", name: "Loose coloring", note: "19 with fewer, thinner crayon strokes and a heavier outline, so the letters win over the scribble.",
    mark: `<svg viewBox="0 0 120 110" width="1.9em"><g clip-path="url(#jkclip)" filter="url(#rough)"><path d="${zig(13)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/></g>${JK('fill="none" stroke="var(--fg)" stroke-width="4.5" stroke-linejoin="round" filter="url(#boil)"')}</svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em"><g clip-path="url(#jkclip)"><path d="${zig(16)}" fill="none" stroke="var(--accent)" stroke-width="5"/></g>${JK('fill="none" stroke="var(--fg)" stroke-width="7" filter="url(#boil)"')}</svg>`, iconScale: 1, headSize: 14 },
  { n: "24", tag: "14 + 15", name: "Boiling name", note: "15's full name and sparkles, but the marker letters boil like 14.",
    mark: `<span class="twinkle">${sparkle("s1")}<span class="boiled">Joe Karlsson</span>${sparkle("s2")}${sparkle("s3")}</span>`,
    icon: `<svg viewBox="0 0 120 110" width="1em">${markerJK('fill="var(--fg)" filter="url(#boil)"')}${sp(110, 10, 12)}</svg>`, iconScale: 1, headSize: 24 },
  { n: "25", tag: "new", name: "Sparkle tittle", note: "A hand-drawn lowercase jk where the dot on the j is a twinkling sparkle. Small idea, very readable.",
    mark: jkHand(), icon: jkHand(), iconScale: .58, headSize: 15 },
  { n: "26", tag: "14 + sticker", name: "Boiling sticker", note: "The round-one sticker, redrawn so the whole thing (edge, shadow, letters) boils.",
    mark: `<svg viewBox="0 0 120 110" width="2em"><g filter="url(#boil)" transform="rotate(-7 60 55)"><rect x="12" y="14" width="100" height="84" rx="10" fill="var(--fg)" transform="translate(5 5)"/><rect x="12" y="14" width="100" height="84" rx="10" fill="var(--accent)"/><text x="62" y="88" text-anchor="middle" font-family="Anton" font-size="78" fill="var(--on-accent)">JK</text></g></svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em"><g filter="url(#boil)"><rect x="4" y="6" width="112" height="98" rx="12" fill="var(--accent)"/><text x="60" y="92" text-anchor="middle" font-family="Anton" font-size="90" fill="var(--on-accent)">JK</text></g></svg>`, iconScale: 1, headSize: 14 },
  { n: "27", tag: "19, readable", name: "Sketch lines", note: "No fill at all: two shaky outlines, white and pink, boiling out of step, like a pencil sketch gone over twice.",
    mark: `<svg viewBox="0 0 120 110" width="1.9em">${JK('fill="none" stroke="var(--accent)" stroke-width="3" transform="translate(3 3)" filter="url(#boil2)"')}${JK('fill="none" stroke="var(--fg)" stroke-width="3" filter="url(#boil)"')}</svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em">${JK('fill="none" stroke="var(--accent)" stroke-width="6" transform="translate(4 4)" filter="url(#boil2)"')}${JK('fill="none" stroke="var(--fg)" stroke-width="6" filter="url(#boil)"')}</svg>`, iconScale: 1, headSize: 14 },
  { n: "28", tag: "19 + 15", name: "Shiny", note: "Solid boiling JK with cartoon shine strokes on each letter and a sparkle catching the corner.",
    mark: `<svg viewBox="0 0 120 110" width="1.9em"><g filter="url(#boil)">${JK('fill="var(--accent)"')}<g clip-path="url(#jkclip)" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"><path d="M16 34 L32 18 M18 46 L26 38 M66 34 L80 20 M68 46 L74 40"/></g></g>${sp(114, 6, 11)}</svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em"><g filter="url(#boil)">${JK('fill="var(--accent)"')}<g clip-path="url(#jkclip)" stroke="var(--fg)" stroke-width="8" stroke-linecap="round"><path d="M16 36 L32 20 M66 36 L80 22"/></g></g></svg>`, iconScale: 1, headSize: 14 },
  { n: "29", tag: "14 + 15", name: "Starburst", note: "Boiling pink rays behind a white JK, like a sticker that says NEW! in a dollar store.",
    mark: `<svg viewBox="0 0 120 110" width="2em"><path d="${rays}" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" filter="url(#boil)"/>${JK('fill="var(--fg)" stroke="var(--bg)" stroke-width="6" paint-order="stroke" filter="url(#boil2)"', 70, 80)}</svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em"><path d="${rays}" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/>${JK('fill="var(--fg)" stroke="var(--bg)" stroke-width="8" paint-order="stroke"', 70, 80)}</svg>`, iconScale: 1.05, headSize: 14 },
  { n: "30", tag: "14 + 15", name: "Orbit", note: "Boiling marker JK with three sparkles slowly circling it.",
    mark: `<svg viewBox="0 0 120 110" width="2em">${markerJK('fill="var(--fg)" filter="url(#boil)"')}<g class="orbit">${sp(60, -18, 9)}${sp(128, 92, 7, .6)}${sp(-8, 92, 6, 1.2)}</g></svg>`,
    icon: `<svg viewBox="0 0 120 110" width="1em">${markerJK('fill="var(--fg)" filter="url(#boil)"')}<g class="orbit">${sp(108, 12, 12)}</g></svg>`, iconScale: 1, headSize: 14 },
];

const grid = document.getElementById("grid");
for (const o of options) {
  const icons = [64, 32, 16].map(s =>
    `<div class="icon dark" style="width:${s}px;height:${s}px;font-size:${s * o.iconScale}px">${o.icon}</div>`).join("");
  grid.insertAdjacentHTML("beforeend", `
    <section class="card">
      <h2><span>${o.n}</span>${o.name}<em>${o.tag}</em></h2>
      <p>${o.note}</p>
      <div class="stage">
        <div class="panel big dark">${o.mark}</div>
        <div class="panel small light">${o.mark}</div>
      </div>
      <div class="headrow"><nav class="bar">
        <span class="logo dark" style="font-size:${o.headSize}px">${o.mark}</span>
        <span class="on">Blog</span><span>About</span><span>Projects</span><span>Newsletter</span><span>Uses</span><span>Contact</span>
        <span class="pause"><svg viewBox="0 0 16 16" width="1em" fill="currentColor"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></span>
      </nav></div>
      <div class="tabs">${icons}
        <div class="tab"><div class="icon dark" style="width:16px;height:16px;font-size:${16 * o.iconScale}px">${o.icon}</div>Joe Karlsson</div>
      </div>
    </section>`);
}

// The boil runs on SVG <animate>, which CSS can't stop, so drop it for reduced-motion visitors
if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelectorAll("animate").forEach(a => a.remove());
</script>
</body>
</html>
