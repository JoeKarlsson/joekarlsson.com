<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Options Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Hanken+Grotesk:wght@400;900&family=Permanent+Marker&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff4fd8; --chrome: #141414; --line: #2a2a2a; --muted: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a0a; color: #fff; font: 16px/1.5 "Hanken Grotesk", system-ui, sans-serif; padding: 40px 16px 80px; }
  header, main { max-width: 1180px; margin: 0 auto; }
  header h1 { font: 400 clamp(40px, 7vw, 72px)/1 Anton, sans-serif; text-transform: uppercase; margin: 0 0 8px; }
  header h1 b { color: var(--pink); font-weight: 400; }
  header p { color: var(--muted); max-width: 62ch; margin: 0 0 32px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 24px; }

  .card { background: var(--chrome); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .card h2 { font: 900 15px/1 "Hanken Grotesk", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0; padding: 16px 18px 6px; }
  .card h2 span { color: var(--pink); margin-right: 8px; }
  .card h2 em { font-style: normal; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 8px; }
  .card p { margin: 0; padding: 0 18px 14px; color: var(--muted); font-size: 14px; }
  .stage { display: grid; grid-template-columns: 2fr 1fr; }
  .panel { display: grid; place-items: center; min-height: 220px; padding: 20px; overflow: hidden; }
  .panel.big { font-size: 56px; }
  .panel.small { font-size: 26px; }
  .tabs { display: flex; align-items: center; gap: 18px; padding: 12px 18px; background: #222; border-top: 1px solid var(--line); font: 400 12px "Hanken Grotesk", sans-serif; color: var(--muted); }
  .tab { display: flex; align-items: center; gap: 8px; background: #333; color: #ddd; border-radius: 6px 6px 0 0; padding: 6px 12px 6px 8px; }
  .icon { display: grid; place-items: center; background: #000; border-radius: 18%; overflow: hidden; flex: none; }

  .dark  { --bg: #000; --fg: #fff; --accent: var(--pink); --on-accent: #000; background: var(--bg); color: var(--fg); }
  .light { --bg: var(--pink); --fg: #000; --accent: #000; --on-accent: var(--pink); background: var(--bg); color: var(--fg); }
  svg { display: block; overflow: visible; }

  /* 01 sticker (hard offset is the sticker's printed edge, not a glow) */
  .sticker { font: 400 1.6em/1 Anton, sans-serif; background: var(--accent); color: var(--on-accent); padding: .08em .22em .04em; border-radius: .14em; transform: rotate(-7deg); box-shadow: .07em .07em 0 var(--fg); display: inline-block; }

  /* 04 crayon signature */
  .crayon { font: 400 .8em/1 "Permanent Marker", cursive; color: var(--accent); white-space: nowrap; transform: rotate(-4deg); display: inline-block; }
  .crayon svg { width: 100%; height: .35em; margin-top: -.05em; }

  /* 11 crayon sticker with a peeling corner */
  .csticker { position: relative; display: inline-block; font: 400 1.3em/1 "Permanent Marker", cursive; background: var(--accent); color: var(--on-accent); padding: .12em .28em .08em; border-radius: .1em; outline: .07em solid var(--fg); transform: rotate(-5deg); animation: wobble 3s ease-in-out infinite; clip-path: polygon(0 0, 100% 0, 100% 72%, 80% 100%, 0 100%); }
  .csticker::after { content: ""; position: absolute; right: 0; bottom: 0; width: 20%; height: 28%; background: var(--fg); clip-path: polygon(0 100%, 100% 0, 0 0); }
  @keyframes wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(-1deg) scale(1.04); } }

  /* 12 self-writing signature */
  .write text { fill: var(--accent); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 700; stroke-dashoffset: 0; animation: write 6s ease-in-out infinite; }
  @keyframes write { 0% { stroke-dashoffset: 700; fill-opacity: 0; } 40% { stroke-dashoffset: 0; fill-opacity: 0; } 55%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; stroke-dashoffset: 0; } }

  /* 13 circled */
  .circled { position: relative; font: 400 .9em/1 "Caveat Brush", cursive; white-space: nowrap; padding: .25em .4em; }
  .circled svg { position: absolute; inset: -.05em -.2em; width: calc(100% + .4em); height: calc(100% + .1em); }
  .circled path { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 900; stroke-dashoffset: 0; animation: circle 4s ease-out infinite; }
  @keyframes circle { 0% { stroke-dashoffset: 900; } 35%, 100% { stroke-dashoffset: 0; } }

  /* 14 line boil */
  .boil { font: 400 1.7em/1 "Permanent Marker", cursive; color: var(--accent); filter: url(#boil); transform: rotate(-3deg); display: inline-block; }

  /* 15 twinkle doodles */
  .twinkle { position: relative; font: 400 .78em/1 "Permanent Marker", cursive; white-space: nowrap; padding: .5em .6em; }
  .twinkle svg { position: absolute; width: .55em; fill: var(--accent); animation: twinkle 1.8s ease-in-out infinite; }
  .twinkle .s1 { left: -.1em; top: .05em; }
  .twinkle .s2 { right: -.05em; top: -.05em; width: .4em; animation-delay: .6s; }
  .twinkle .s3 { right: .6em; bottom: .05em; width: .32em; animation-delay: 1.2s; }
  @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(.4) rotate(45deg); } }

  /* 16 tape label */
  .tape { display: inline-block; font: 400 .7em/1 "Permanent Marker", cursive; text-transform: uppercase; background: var(--accent); color: var(--on-accent); padding: .3em .8em .25em; transform: rotate(3deg); white-space: nowrap;
    clip-path: polygon(0 4%, 3% 18%, 1% 34%, 4% 50%, 0 66%, 3% 82%, 1% 100%, 99% 96%, 97% 80%, 100% 64%, 96% 48%, 100% 32%, 97% 16%, 100% 0); }

  /* 17 sticker pile */
  .pile { position: relative; width: 5.4em; height: 2.9em; font-size: .75em; }
  .pile > * { position: absolute; display: inline-block; outline: .06em solid var(--fg); border-radius: .12em; animation: slap 5s ease-out infinite both; }
  .pile .a { left: .1em; top: .05em; font: 400 1.05em/1 Anton, sans-serif; background: var(--accent); color: var(--on-accent); padding: .1em .25em; transform: rotate(-9deg); }
  .pile .b { left: .7em; top: 1.45em; white-space: nowrap; font: 400 .8em/1 "Permanent Marker", cursive; background: var(--fg); color: var(--bg); padding: .15em .3em; transform: rotate(5deg); animation-delay: .25s; }
  .pile .c { right: .1em; top: -.05em; width: .9em; height: .9em; border-radius: 50%; background: var(--fg); display: grid; place-items: center; transform: rotate(14deg); animation-delay: .5s; }
  .pile .c svg { width: .6em; fill: var(--accent); }
  @keyframes slap { 0% { scale: 1.6; opacity: 0; } 8% { scale: .95; opacity: 1; } 12%, 100% { scale: 1; opacity: 1; } }

  /* 18 highlighter swipe */
  .hl { position: relative; font: 400 1em/1 "Caveat Brush", cursive; white-space: nowrap; padding: .05em .2em; color: var(--on-accent); }
  .hl::before { content: ""; position: absolute; inset: .1em -.05em 0; background: var(--accent); z-index: 0; transform-origin: left; transform: rotate(-1.5deg); clip-path: polygon(1% 8%, 99% 0, 100% 90%, 0 100%); animation: swipe 4s ease-out infinite; }
  .hl span { position: relative; }
  @keyframes swipe { 0% { transform: rotate(-1.5deg) scaleX(0); } 25%, 100% { transform: rotate(-1.5deg) scaleX(1); } }

  /* 19 crayon-fill JK */
  .hatch path { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linejoin: round; }
  .hatch text { fill: none; stroke: var(--fg); stroke-width: 2.5; }

  /* 20 bouncy letters */
  .bounce { font: 400 .8em/1 "Permanent Marker", cursive; white-space: nowrap; }
  .bounce span { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
  .bounce span:nth-child(odd) { color: var(--accent); }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-.18em) rotate(-6deg); } }


  /* Site header replica (Header.astro): paper bar, Anton stickers, logo in the home slot */
  .headrow { background: #000; padding: 22px 12px; display: flex; justify-content: center; overflow: hidden; border-top: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: .19em; background: #ededed; color: #000; border-radius: .67em; padding: .29em; font: 400 14px/1 Anton, sans-serif; text-transform: uppercase; white-space: nowrap; }
  .bar > span { padding: .38em .48em; border-radius: .43em; }
  .bar > .on { background: var(--pink); }
  .bar > .pause { background: #000; color: #ededed; padding: .38em; display: grid; }
  .bar > .logo { padding: .32em .5em; display: grid; place-items: center; text-transform: none; line-height: 1; }
  .bar > .logo .panel-fix { display: grid; place-items: center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  @media (max-width: 560px) { .stage { grid-template-columns: 1fr; } .panel.big { font-size: 44px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1">
      <animate attributeName="seed" values="1;4;8" dur="0.36s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="4"/>
  </filter>
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="3"/>
  </filter>
  <clipPath id="jkclip"><text x="60" y="100" text-anchor="middle" font-family="Anton" font-size="104">JK</text></clipPath>
</svg>

<header>
  <h1>Logo options, <b>batch two</b></h1>
  <p>Keepers 01 and 04 from the first round, plus ten new hand-drawn ones (11 to 20). Six of them move. Tell me the numbers to keep.</p>
</header>
<main id="grid"></main>

<script>
const scribble = `<svg viewBox="0 0 300 30" preserveAspectRatio="none"><path d="M6 18 C 70 6, 150 26, 290 10 M40 24 C 120 16, 200 22, 260 18" stroke="var(--fg)" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
const sparkle = cls => `<svg class="${cls}" viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0Z"/></svg>`;
const heart = `<svg viewBox="0 0 20 18"><path d="M10 17 C2 11 0 7 2 3 C4 0 8 1 10 4 C12 1 16 0 18 3 C20 7 18 11 10 17Z"/></svg>`;

let zig = "M-10 6";
for (let x = -10, up = true; x < 130; x += 6, up = !up) zig += ` L${x + 9} ${up ? 104 : 6}`;
const hatch = `<svg class="hatch" viewBox="0 0 120 110" width="1.9em">
  <g clip-path="url(#jkclip)" filter="url(#rough)"><path d="${zig}"/></g>
  <text x="60" y="100" text-anchor="middle" font-family="Anton" font-size="104" filter="url(#boil)">JK</text>
</svg>`;

const bouncy = word => `<span class="bounce">${[...word].map((c, i) =>
  c === " " ? "&nbsp;" : `<span style="animation-delay:${i * .08}s">${c}</span>`).join("")}</span>`;

const options = [
  { n: "01", headSize: 14, tag: "keeper", name: "Sticker", note: "From round one. Anton JK on a tilted sticker.",
    mark: `<span class="sticker">JK</span>`, icon: `<span class="sticker">JK</span>`, iconScale: .34 },
  { n: "04", headSize: 26, tag: "keeper", name: "Crayon signature", note: "From round one. Hand-scrawled name with a scribble underline.",
    mark: `<span class="crayon">Joe Karlsson${scribble}</span>`, icon: `<span class="crayon" style="font-size:1.3em">jk</span>`, iconScale: .5 },
  { n: "11", headSize: 14, tag: "animated", name: "Crayon sticker", note: "01 and 04 combined: scrawled JK on a die-cut sticker with a peeling corner. It wobbles a little, like it was just stuck on.",
    mark: `<span class="csticker">JK</span>`, icon: `<span class="csticker">JK</span>`, iconScale: .4 },
  { n: "12", headSize: 24, tag: "animated", name: "Signs itself", note: "Your name traces itself in marker and fills in, then starts over. Could play once on page load instead.",
    mark: `<svg class="write" viewBox="0 0 330 90" width="5.2em"><text x="165" y="64" text-anchor="middle" font-family="Permanent Marker" font-size="52" transform="rotate(-4 165 45)">Joe Karlsson</text></svg>`,
    icon: `<svg class="write" viewBox="0 0 100 100" width="1em"><text x="50" y="72" text-anchor="middle" font-family="Permanent Marker" font-size="64">jk</text></svg>`, iconScale: 1 },
  { n: "13", headSize: 22, tag: "animated", name: "Circled", note: "Your name with a pen loop drawn around it, like circling something important in a notebook.",
    mark: `<span class="circled">Joe Karlsson<svg viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M120 12 C 40 10, 6 30, 10 55 C 16 88, 150 96, 250 86 C 300 78, 300 30, 250 16 C 200 4, 110 6, 70 22"/></svg></span>`,
    icon: `<span class="circled" style="font-size:1.1em;padding:.15em .25em">jk<svg viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M120 12 C 40 10, 6 30, 10 55 C 16 88, 150 96, 250 86 C 300 78, 300 30, 250 16 C 200 4, 110 6, 70 22"/></svg></span>`, iconScale: .5 },
  { n: "14", headSize: 13, tag: "animated", name: "Line boil", note: "Marker JK that jitters like hand-drawn animation frames. Always moving, never distracting.",
    mark: `<span class="boil">JK</span>`, icon: `<span class="boil">JK</span>`, iconScale: .38 },
  { n: "15", headSize: 24, tag: "animated", name: "Twinkle doodles", note: "Marker name with little hand-drawn sparkles that pulse around it.",
    mark: `<span class="twinkle">${sparkle("s1")}Joe Karlsson${sparkle("s2")}${sparkle("s3")}</span>`,
    icon: `<span class="twinkle" style="font-size:1.1em;padding:.3em .35em">${sparkle("s2")}jk</span>`, iconScale: .5 },
  { n: "16", headSize: 24, tag: "static", name: "Tape label", note: "Your name in marker on a torn strip of pink tape. Cheap and handmade on purpose.",
    mark: `<span class="tape">Joe Karlsson</span>`, icon: `<span class="tape" style="font-size:1em;padding:.25em .3em">JK</span>`, iconScale: .42 },
  { n: "17", headSize: 15, tag: "animated", name: "Sticker pile", note: "JK, Joe Karlsson and a heart slapped on one after another, like a laptop lid.",
    mark: `<div class="pile"><span class="a">JK</span><span class="b">Joe Karlsson</span><span class="c">${heart}</span></div>`,
    icon: `<span class="sticker" style="font-size:1.3em">JK</span>`, iconScale: .42 },
  { n: "18", headSize: 20, tag: "animated", name: "Highlighter", note: "A pink highlighter swipe that reveals your name as it passes.",
    mark: `<span class="hl"><span>Joe Karlsson</span></span>`, icon: `<span class="hl" style="font-size:1.4em"><span>jk</span></span>`, iconScale: .5 },
  { n: "19", headSize: 14, tag: "animated", name: "Colored in", note: "Block JK outlined in a shaky line and filled with crayon zigzags, like a kid colored it in.",
    mark: hatch, icon: hatch, iconScale: .5 },
  { n: "20", headSize: 24, tag: "animated", name: "Bouncy", note: "Marker letters that hop one after another, alternating pink and white.",
    mark: bouncy("Joe Karlsson"), icon: bouncy("jk"), iconScale: .62 },
];

const grid = document.getElementById("grid");
for (const o of options) {
  const icons = [64, 32, 16].map(s =>
    `<div class="icon dark" style="width:${s}px;height:${s}px;font-size:${s * o.iconScale}px">${o.icon}</div>`).join("");
  grid.insertAdjacentHTML("beforeend", `
    <section class="card">
      <h2><span>${o.n}</span>${o.name}<em>${o.tag}</em></h2>
      <p>${o.note}</p>
      <div class="stage">
        <div class="panel big dark">${o.mark}</div>
        <div class="panel small light">${o.mark}</div>
      </div>
      <div class="headrow"><nav class="bar">
        <span class="logo dark" style="font-size:${o.headSize}px">${o.mark}</span>
        <span class="on">Blog</span><span>About</span><span>Projects</span><span>Newsletter</span><span>Uses</span><span>Contact</span>
        <span class="pause"><svg viewBox="0 0 16 16" width="1em" fill="currentColor"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></span>
      </nav></div>
      <div class="tabs">${icons}
        <div class="tab"><div class="icon dark" style="width:16px;height:16px;font-size:${16 * o.iconScale}px">${o.icon}</div>Joe Karlsson</div>
      </div>
    </section>`);
}
</script>
</body>
</html>
