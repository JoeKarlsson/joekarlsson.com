# Lychee link checker configuration
# Shared by CI (internal only) and weekly external check

# Excluded domains. An exclusion hides a link from CI but still ships it to
# readers, so only add one for a site that is alive but hostile to automated
# checkers - never to silence a genuinely dead link.
#
# Audited 2026-07-30: the speakerdeck exclusion was masking five 404s, all of
# which are now fixed. Verify before adding anything here.
exclude = [
  # Block or rate-limit CI runners; alive in a browser
  "twitter\\.com",
  "x\\.com",
  "linkedin\\.com",
  "facebook\\.com",
  "instagram\\.com",
  "t\\.co",
  "bestbuy\\.com",
  "mckinsey\\.com",
  "building\\.calibreapp\\.com",
  "dykestowatchoutfor\\.com",
  "ui\\.tinybird\\.co",

  # HTTP/2 protocol errors from CI runners; alive in a browser
  "globenewswire\\.com",

  # Slow or intermittently 5xx from CI, verified reachable 2026-07-30
  "speakerdeck\\.com",
  "confoo\\.ca",
  "smarthomejunkie\\.net",
  "kailua\\.org",
  "bechdel\\.io",
  "audiopro\\.com",
  "pi-hole\\.net",
  "raspberrytips\\.com",
  "docs\\.atlas\\.mongodb\\.com",
  "docs\\.mongodb\\.com",
  "gdpr\\.eu",
  "icebreakers\\.ws",
  "sonoff\\.tech",
  "embrace\\.io",

  # Not real external links
  "localhost",
  "127\\.0\\.0\\.1",
  "192\\.168\\.",
  "hero-illustration\\.webp",
  "http:/https:"
]

# Exclude paths that don't map to files or are known broken
exclude_path = ["404", "hero-illustration", "http:/https:"]

# Accept these status codes as valid
accept = [200, 202, 204, 301, 302, 307, 403, 429]

# Timeout per request (seconds)
timeout = 30

# Max concurrent requests
max_concurrency = 5

# Don't check email addresses
include_mail = false

# For offline mode, resolve /foo to /foo/index.html
fallback_extensions = ["html"]
