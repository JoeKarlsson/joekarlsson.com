<!doctype html>
<!-- A small handmade animation for /blog/doom-mcp-server/: Claude calls go_to, play.py plans the
     waypoints, and the marine walks them. Render with scripts/handmade/render.mjs. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>go_to walk</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@600&family=JetBrains+Mono&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--ink: #000;
				--paper: #ededed;
				--muted: #a3a3a3;
				--pink: #ff4fd8;
			}
			html,
			body {
				margin: 0;
				background: var(--ink);
			}
			#walk {
				display: block;
				width: 640px;
				height: auto;
				overflow: visible;
			}
			.walls {
				fill: none;
				stroke: var(--paper);
				stroke-width: 3;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			.door {
				stroke: var(--paper);
				stroke-width: 6;
				stroke-linecap: round;
			}
			.monster {
				fill: none;
				stroke: var(--paper);
				stroke-width: 2.5;
				stroke-linecap: round;
			}
			.plan {
				fill: none;
				stroke: var(--muted);
				stroke-width: 2;
				stroke-dasharray: 2 7;
				stroke-linecap: round;
			}
			.wp {
				fill: var(--muted);
			}
			.marine {
				fill: var(--pink);
				stroke: var(--pink);
				stroke-width: 2;
				stroke-linejoin: round;
			}
			.use {
				stroke: var(--pink);
				stroke-width: 2.5;
				stroke-linecap: round;
			}
			.call {
				font-family: 'JetBrains Mono', monospace;
				font-size: 26px;
				fill: var(--paper);
			}
			.room-name {
				font-family: 'Hanken Grotesk', sans-serif;
				font-weight: 600;
				font-size: 22px;
				fill: var(--muted);
			}
			@media (prefers-reduced-motion: no-preference) {
				.boil {
					filter: url(#boil);
				}
			}
		</style>
	</head>
	<body>
		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<filter id="boil" x="-25%" y="-25%" width="150%" height="150%">
				<feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="1" seed="11" result="w">
					<animate
						attributeName="seed"
						values="11;22;33"
						dur="0.5s"
						calcMode="discrete"
						repeatCount="indefinite"
					/>
				</feTurbulence>
				<feDisplacementMap in="SourceGraphic" in2="w" scale="4" />
			</filter>
		</svg>

		<svg
			id="walk"
			data-handmade
			viewBox="0 0 600 290"
			role="img"
			aria-label="Claude calls go_to with Salesforce. Waypoints appear, and the marine backs out of its room, walks the hall, stops short of the Salesforce door, presses use, waits for the door to open, and walks in among the monsters."
		>
			<text class="call" id="call" x="30" y="28"></text>
			<g class="boil">
				<g class="walls">
					<path d="M32 60 C80 57 140 63 190 59" />
					<path d="M190 59 L191 140" />
					<path d="M191 181 L189 262" />
					<path d="M189 262 C130 265 70 259 31 263" />
					<path d="M31 263 L32 60" />
					<path d="M191 140 C260 137 320 142 390 139" />
					<path d="M191 181 C260 184 320 179 390 182" />
					<path d="M390 139 L391 48" />
					<path d="M391 48 C460 45 520 51 580 47" />
					<path d="M580 47 L579 272" />
					<path d="M579 272 C510 275 450 269 390 273" />
					<path d="M390 273 L390 182" />
				</g>
				<line class="door" id="door" x1="390" y1="141" x2="390" y2="180" />
				<g class="monster">
					<path d="M455 104 C468 101 470 122 456 124 C443 126 441 106 455 104 Z" />
					<path d="M449 105 L446 97 M461 105 L464 97 M451 113 l1 0 M460 113 l1 0" />
					<path d="M520 172 C542 168 545 205 521 208 C499 211 497 175 520 172 Z" />
					<path
						d="M509 174 L503 160 M531 174 L537 160 M512 186 l3 1 M526 187 l3 -1 M513 198 L517 195 L521 199 L525 195 L529 198"
					/>
					<path d="M470 226 C482 224 484 244 471 245 C458 246 457 228 470 226 Z" />
					<path d="M464 227 L461 219 M476 227 L479 219 M466 235 l1 0 M475 235 l1 0" />
				</g>
				<path class="plan" id="plan" d="" />
				<g id="wps"></g>
				<g id="use" opacity="0">
					<path class="use" d="M378 148 L370 141 M376 160 L368 160 M378 172 L370 179" />
				</g>
				<path class="marine" id="marine" d="M10 0 L-7 -7 L-3 0 L-7 7 Z" />
			</g>
			<text class="room-name" x="485" y="80" text-anchor="middle">Salesforce</text>
		</svg>
		<script>
			const CALL = 'go_to {"place": "Salesforce"}';
			const START = { x: 92, y: 222, a: -90 };
			const WAYPOINTS = [
				{ x: 120, y: 160 },
				{ x: 205, y: 160 },
				{ x: 352, y: 160 },
				{ x: 430, y: 160 },
				{ x: 488, y: 150 },
			];
			const DOOR_STOP = 2; // index of the waypoint just short of the door
			const FPS = 12; // drawn on twos, like the collage scenes and Ammer's GIFs
			const SPEED = 130; // map units a second
			const TURN = 400; // degrees a second

			const svg = document.getElementById('walk');
			const $ = (id) => document.getElementById(id);
			const ns = 'http://www.w3.org/2000/svg';

			// The plan: a dotted line through the waypoints, with a dot landing as the line reaches each
			const wpDots = WAYPOINTS.map((p) => {
				const c = document.createElementNS(ns, 'circle');
				c.setAttribute('cx', p.x);
				c.setAttribute('cy', p.y);
				c.setAttribute('r', 4);
				c.setAttribute('class', 'wp');
				$('wps').append(c);
				return c;
			});
			const pts = [START, ...WAYPOINTS];
			$('plan').setAttribute('d', 'M' + pts.map((p) => `${p.x} ${p.y}`).join(' L'));
			const planLength = $('plan').getTotalLength();
			const reachedAt = []; // distance along the plan of each waypoint
			for (let i = 1, d = 0; i < pts.length; i++) {
				d += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
				reachedAt.push(d);
			}
			const fullPlan = $('plan').getAttribute('d');

			const angleTo = (from, to) => (Math.atan2(to.y - from.y, to.x - from.x) * 180) / Math.PI;
			const shortest = (from, to) => from + (((((to - from) % 360) + 540) % 360) - 180);

			// The walk as a list of timed steps
			const steps = [];
			let pos = { ...START };
			const turnTo = (a) => {
				const to = shortest(pos.a, a);
				const d = Math.max(0.15, Math.abs(to - pos.a) / TURN);
				steps.push({ kind: 'turn', from: pos.a, to, d, at: { ...pos } });
				pos.a = to;
			};
			// The engine walks once it faces within 45 degrees, so only a sharper turn stops the marine
			const moveTo = (p) => {
				const a = shortest(pos.a, angleTo(pos, p));
				if (Math.abs(a - pos.a) >= 45) turnTo(a);
				const d = Math.hypot(p.x - pos.x, p.y - pos.y) / SPEED;
				steps.push({ kind: 'move', from: { ...pos }, to: p, d, toA: a });
				pos = { x: p.x, y: p.y, a };
			};
			const wait = (d, kind = 'wait') => steps.push({ kind, d, at: { ...pos } });
			WAYPOINTS.forEach((p, i) => {
				moveTo(p);
				if (i === DOOR_STOP) {
					wait(0.25);
					wait(0.4, 'use');
					wait(1.0, 'door');
				}
			});
			wait(2.0, 'hold');

			const T_TYPE = 0.2,
				T_PLAN = 1.8,
				T_WALK = 3.0;
			const walkLength = steps.reduce((s, st) => s + st.d, 0);
			// On the frame grid, with one fully reset drawing before the loop starts again
			const T_RESET = Math.ceil((T_WALK + walkLength) * FPS) / FPS,
				LOOP = T_RESET + 0.5 + 1 / FPS;
			const ease = (u) => 1 - Math.pow(1 - u, 2);

			function render(t) {
				// The call types in, two characters a drawing
				$('call').textContent = CALL.slice(0, Math.max(0, Math.round((t - T_TYPE) * FPS)) * 2);
				// The plan draws dotted the whole way, and each dot lands when the line reaches it
				const drawn = planLength * Math.min(1, Math.max(0, (t - T_PLAN) / 0.9));
				const passed = pts.slice(0, 1 + reachedAt.filter((d) => d <= drawn).length);
				const seg = passed.length - 1,
					from = pts[seg],
					to = pts[Math.min(seg + 1, pts.length - 1)];
				const segStart = seg ? reachedAt[seg - 1] : 0,
					segU = Math.min(1, (drawn - segStart) / ((reachedAt[seg] ?? segStart) - segStart || 1));
				const tip = { x: from.x + (to.x - from.x) * segU, y: from.y + (to.y - from.y) * segU };
				$('plan').setAttribute(
					'd',
					drawn >= planLength
						? fullPlan
						: 'M' + [...passed, tip].map((p) => `${p.x} ${p.y}`).join(' L'),
				);
				$('plan').style.opacity = drawn > 0 ? 1 : 0;
				wpDots.forEach((c, i) => (c.style.opacity = drawn >= reachedAt[i] ? 1 : 0));

				// Walk the steps
				let m = { ...START },
					door = 0,
					use = 0,
					tt = t - T_WALK;
				if (tt > 0) {
					for (const st of steps) {
						const u = Math.min(1, tt / st.d);
						if (st.kind === 'move') {
							const k = Math.min(1, tt / (2 / FPS));
							m = {
								x: st.from.x + (st.to.x - st.from.x) * u,
								y: st.from.y + (st.to.y - st.from.y) * u,
								a: st.from.a + (st.toA - st.from.a) * k,
							};
						} else if (st.kind === 'turn') {
							m = { ...st.at, a: st.from + (st.to - st.from) * ease(u) };
						} else {
							m = { ...st.at };
							if (st.kind === 'use') use = u < 1 ? 1 : 0;
							if (st.kind === 'door') door = u;
						}
						if (st.kind === 'door' && u >= 1) door = 1;
						if (tt <= st.d) break;
						tt -= st.d;
					}
				}
				// The reset: the door slides shut and the plan and the call clear
				if (t > T_RESET) {
					const r = Math.min(1, (t - T_RESET) / 0.5);
					door = 1 - r;
					$('plan').style.opacity = 1 - r;
					wpDots.forEach((c) => (c.style.opacity = 1 - r));
					$('call').style.opacity = 1 - r;
					$('marine').style.opacity = 1 - r;
				} else {
					$('call').style.opacity = 1;
					$('marine').style.opacity = 1;
				}

				$('door').setAttribute('y2', 180 - 36 * door);
				$('use').setAttribute('opacity', use);
				$('marine').setAttribute('transform', `translate(${m.x} ${m.y}) rotate(${m.a})`);
			}

			const still = matchMedia('(prefers-reduced-motion: reduce)');
			if (still.matches || location.hash === '#frames') {
				render(T_RESET - 0.01);
			} else {
				const t0 = performance.now();
				const tick = (now) => {
					const t = ((now - t0) / 1000) % LOOP;
					render(Math.floor(t * FPS) / FPS);
					requestAnimationFrame(tick);
				};
				requestAnimationFrame(tick);
			}
			// For scripts/handmade/render.mjs: draw any moment, the loop length, the rate, and the still
			window.__render = render;
			window.__loop = LOOP;
			window.__fps = FPS;
			window.__still = T_RESET - 0.01;
		</script>
	</body>
</html>
