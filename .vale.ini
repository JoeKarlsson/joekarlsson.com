StylesPath = .vale/styles
MinAlertLevel = warning

# JoeKarlsson (base voice) comes from the shared package; edit rules in
# github.com/JoeKarlsson/vale-styles, not here. On Joe's Macs the global Vale
# folder (dotfiles) provides the same styles and wins rule by rule.
Packages = https://github.com/Syntaf/vale-llm-slop/releases/latest/download/vale-llm-slop.zip, write-good, https://github.com/JoeKarlsson/vale-styles/releases/latest/download/vale-styles.zip

[*.md]
BasedOnStyles = JoeKarlsson, Slop, write-good

# write-good: configure severity; disable rules that conflict with Joe's voice
write-good.EPrime = NO
write-good.So = NO
write-good.Passive = warning
write-good.Weasel = warning
write-good.ThereIs = warning
write-good.TooWordy = warning
write-good.Illusions = warning
write-good.Cliches = warning

# Newer base rules are strict for social posts; on the blog they warn so CI
# (errors only) doesn't fail every old post that uses "most teams".
JoeKarlsson.AbstractReveal = warning
JoeKarlsson.VagueAttribution = warning
JoeKarlsson.InternalFraming = warning

# "MongoDB Realm" is a product name — disable BannedWords for this one post
# whose title/description/tldr are literally about that product
[src/content/blog/building-a-real-time-digital-graffiti-wall.md]
JoeKarlsson.BannedWords = NO
