<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" width="640" height="446" role="img" aria-label="Where this newsletter goes next. It left Substack, where TL;DR in Tech lived, in October 2026, bringing 141 subscribers as a CSV. Today it runs on listmonk in Joe's homelab sending through Brevo's free plan: $0 extra a month, 300 emails a day for the whole account, shared with critical alerts and a Plex newsletter. Once the list nears 300, the undecided next step is either Brevo Starter, $9 a month for 5,000 emails with no daily limit and no change in listmonk, or Amazon SES, $0.10 per 1,000 emails, about 3 cents an issue at 300, which needs a new SMTP login, new DKIM records and a way out of the SES sandbox.">
