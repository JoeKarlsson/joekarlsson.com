<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-label="How Pixelate turns a photo into blocks. You pick a photo, and it never leaves your device. Pixelate works on a copy whose longest side is 2,000 pixels at most. The slider sets the block size, from 1 to 120 pixels, starting at 24. Each block becomes one color, the exact average of the pixels under it, and that small grid of blocks is stretched back up with smoothing turned off, so the blocks stay square. Save PNG writes it at the photo's full size, up to 8,000 pixels a side.">
