<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="How the MikroTik API client talks to RouterOS. The Python script, using only socket and struct, opens a raw TCP connection to RouterOS on port 8728. It sends a /login sentence with =name= and =password= words, and RouterOS answers !done. Then it sends a command such as /interface/bonding/print, and RouterOS answers with one !re sentence per record, then !done, or !trap on an error. On the wire, each word goes out as its length and then its bytes: 06 and the six bytes of /login, 0b and the eleven bytes of =name=admin, and a 00 byte ends the sentence. The length byte works like UTF-8: its high bits say how many more length bytes follow.">
