<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 830" width="360" height="830" role="img" aria-label="How Nothing But Corners aims the logo. Mirror the screen across every wall and a bouncing path becomes a straight line through a grid of screens, where every grid point is a screen corner. The logo aims at a corner up to three screens away, along a step with no common factor so the line passes no other corner on the way. Any path that bounces off a wall within a quarter of the screen of a corner is thrown out, so there are no near misses. Folded back into one screen, each grid line the straight line crossed is a bounce: here, three screens across and two up becomes three bounces that end in the opposite corner.">
