<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 750" width="360" height="750" role="img" aria-label="How App-All-O-Gizer sends an apology. You type someone's email address and click Send Email. The Express server picks one of 13 apologies at random and sends it through Gmail with Nodemailer, straight to their inbox. The schedule that was supposed to send one every month, week or day, with node-cron, was never built, so every click sends one apology right away.">
