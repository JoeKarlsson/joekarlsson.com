<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" width="360" height="900" role="img" aria-label="How linger decides which words you get. It measures how fast you scroll, smoothed over about 0.15 seconds. Under 60 pixels a second you are still, and every line on screen gathers time. Between 60 and 700 you are reading, and nothing changes. Over 700 you are skimming, and the lines lose time four times faster than they gathered it; over 2,100 the page whispers &quot;slower.&quot; Each line starts with its plain words. After 1.2 seconds of stillness the words marked with a caret fill in, and after 3.6 seconds the words marked with a tilde fill in too. In the poem file a line looks like: tilde the call, caret came, tilde at five-forty: no school.">
