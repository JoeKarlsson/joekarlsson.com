<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 850" width="360" height="850" role="img" aria-label="How a GAPTCHA hunt works. You scan a printed marker, held with its name on top and facing north, and AR.js finds it in the camera. Your phone's location and the checkpoint go into a compass bearing: near the original spot in Honolulu the checkpoint is the 2017 one, anywhere else it's a demo checkpoint 100 to 300 meters from you. A green 3D arrow on the marker turns to that bearing. An arrow gives a direction but no distance, so you scan markers in a few places and walk to where the arrows cross, then tap Did I Win. Within 20 meters you win, and it tells you how many tries everyone took since the last win; farther away, you scan another marker.">
