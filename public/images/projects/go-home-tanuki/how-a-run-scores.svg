<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" role="img" aria-label="How a run of Go Home Tanuki scores. The tanuki starts at a drunkness of 5. Small sake adds 1 and large sake adds 3, and every 3 seconds he sobers up by 1. Once his drunkness reaches 10, the street lamps come at you ten times faster and the clouds faster too, for the rest of the run, even if he sobers up. The run only ends when he hits a cloud or a rock. Then the score is his drunkness times the seconds he lasted, plus 10 points for every meter, plus a combo bonus: the sake streak times the combo, times 5. The combo goes up by one for every 3 sake in a row, up to 5, and resets after 5 seconds without sake.">
