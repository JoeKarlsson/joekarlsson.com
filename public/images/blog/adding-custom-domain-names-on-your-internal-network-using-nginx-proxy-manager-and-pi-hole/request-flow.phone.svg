<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-label="How a custom local domain resolves. The browser asks Pi-hole where magic.mirror is, and Pi-hole’s local DNS record answers with Nginx Proxy Manager’s IP. The browser sends its request for magic.mirror to Nginx Proxy Manager, whose proxy host forwards it to the IP of the server running Magic Mirror, and the page comes back the same way.">
