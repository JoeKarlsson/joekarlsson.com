<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 916" width="360" height="916" role="img" aria-label="How the Bechdel Test Visualizer reads a screenplay. It takes the title from the first line of the text file and asks myapifilms.com for the cast, their characters and each one’s gender. Then it splits the script into scenes using 10 to 12 keywords like int. and ext., and collects each character’s dialogue. A scene fails if fewer than two women are in it. If two or more are, it checks their dialogue for words about a man, like he, him, father or king: if it finds one, the scene fails, and if not, the scene passes.">
