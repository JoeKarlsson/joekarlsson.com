<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Bar chart of how much of each part of the rack I use, from 30 days of Prometheus data. CPU: 13% busy on average. RAM: 28% in use (72 of 256 GB). Network: the busiest minute used 12% of one 10G link. Quadro RTX 4000: peaks at 59% of its VRAM (4.7 of 8 GB). RTX A4000: peaks at 94% (about 15 of 16 GB) when the 30B coding model loads, and sits close to empty the rest of the day.">
