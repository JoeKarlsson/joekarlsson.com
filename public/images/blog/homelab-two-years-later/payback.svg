<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Line chart of what the homelab has saved over time against the $7,200 it cost in hardware. Netting about $131 a month (subscriptions killed, minus electricity and backups), savings cross the hardware line at about 4.6 years. Take out the $80-a-month security monitoring plan and it nets about $51 a month, crossing at about 11.8 years.">
