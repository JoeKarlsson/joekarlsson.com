<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="Two auth boundaries in an MCP deployment. Between the AI agent and the MCP server sits agent-to-server identity, which the roadmap covers with DPoP, workload identity federation and token exchange. Between the MCP server and enterprise data sources like Salesforce, SQL Server, an on-premises database and a REST API sits server-to-source credentials (OAuth tokens, service accounts, API keys), which the roadmap doesn’t cover, so it stays per connector.">
