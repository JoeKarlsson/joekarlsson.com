<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600" role="img" aria-label="The voice pipeline: the wake word is detected over Wyoming, the microphone audio goes to faster-whisper on a GPU (a Wyoming speech-to-text service on its own host) for speech to text, then to llama3.2:3b on Ollama on the GPU server for intent and a response, then to Piper for text to speech, and out of the speaker.">
