<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="The voice pipeline: the wake word is detected over Wyoming, the microphone audio goes to faster-whisper on a GPU (a Wyoming speech-to-text service on its own host) for speech to text, then to llama3.2:3b on Ollama on the GPU server for intent and a response, then to Piper for text to speech, and out of the speaker.">
