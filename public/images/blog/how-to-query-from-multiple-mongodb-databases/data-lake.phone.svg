<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="MongoDB Atlas Data Lake: a user sends a standard query to an application, which sends one federated query to the Data Lake compute plane. The compute plane spreads the work across MongoDB nodes in two clusters, three on AWS in US East and three on Google Cloud in US West, each running mongod with an agent.">
