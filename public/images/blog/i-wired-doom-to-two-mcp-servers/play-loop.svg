<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1090" role="img" aria-labelledby="t3 d3">
  <title id="t3">The loop Claude plays</title>
  <desc id="d3">A flowchart. Claude starts with go_to("keycards"), then go_to the next room. If it arrives it calls look, and if monsters block the way it calls attack on the closest pids first. After look it attacks the most urgent pid, and each kill makes Connect AI read the record again. It repeats until the room is clear, then moves to the next room, and finally calls go_to("vault") and writes a summary if the vault will not open.</desc>
  <defs>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#777577"/></marker>
  </defs>
  <rect width="880" height="1090" fill="#0b0f1c"/>
  <g font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#F1EEE9" text-anchor="middle">
    <text x="30" y="38" font-size="17" font-weight="600" text-anchor="start">The loop Claude plays</text>
    <text x="30" y="62" fill="#B5B9BC" text-anchor="start">This loop is the prompt, not code: Claude decides every step.</text>
    <!-- legend -->
    <rect x="560" y="88" width="26" height="16" rx="3" fill="#15151C" stroke="#E8290B" stroke-width="2"/>
    <text x="598" y="101" font-size="13" fill="#B5B9BC" text-anchor="start">tool call to Doom</text>
    <rect x="560" y="114" width="26" height="16" rx="3" fill="#15151C" stroke="#FFE500" stroke-width="2"/>
    <text x="598" y="127" font-size="13" fill="#B5B9BC" text-anchor="start">Connect AI step</text>

    <g stroke="#777577" stroke-width="2" fill="none" marker-end="url(#ae)">
      <line x1="330" y1="124" x2="330" y2="158"/>
      <line x1="330" y1="204" x2="330" y2="248"/>
      <line x1="330" y1="294" x2="330" y2="398"/>
      <path d="M470 272 H720 V328"/>
      <path d="M720 374 V422 H472"/>
      <line x1="330" y1="444" x2="330" y2="488"/>
      <line x1="470" y1="512" x2="558" y2="512"/>
      <line x1="330" y1="534" x2="330" y2="590"/>
      <path d="M220 630 H120 V422 H188"/>
      <line x1="330" y1="670" x2="330" y2="738"/>
      <path d="M220 780 H70 V272 H188"/>
      <line x1="330" y1="820" x2="330" y2="868"/>
      <line x1="330" y1="914" x2="330" y2="958"/>
    </g>
    <line x1="330" y1="715" x2="558" y2="715" stroke="#777577" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- nodes -->
    <rect x="270" y="90" width="120" height="34" rx="17" fill="#111827" stroke="#B5B9BC"/>
    <text x="330" y="112" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">START</text>
    <g font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">
      <rect x="190" y="160" width="280" height="44" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/><text x="330" y="188">go_to("keycards")</text>
      <rect x="190" y="250" width="280" height="44" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/><text x="330" y="278">go_to(next room)</text>
      <rect x="590" y="330" width="260" height="44" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/><text x="720" y="358" font-size="13">attack(closest_pids)</text>
      <rect x="190" y="400" width="280" height="44" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/><text x="330" y="428">look</text>
      <rect x="190" y="490" width="280" height="44" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/><text x="330" y="518" font-size="13">attack(urgent pid first)</text>
      <rect x="190" y="870" width="280" height="44" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/><text x="330" y="898">go_to("vault")</text>
    </g>
    <rect x="270" y="960" width="120" height="34" rx="17" fill="#111827" stroke="#B5B9BC"/>
    <text x="330" y="982" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">summary</text>
    <!-- decisions -->
    <polygon points="330,590 440,630 330,670 220,630" fill="#111827" stroke="#B5B9BC" stroke-width="2"/>
    <text x="330" y="635" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700">room clear?</text>
    <polygon points="330,740 440,780 330,820 220,780" fill="#111827" stroke="#B5B9BC" stroke-width="2"/>
    <text x="330" y="785" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700">more rooms?</text>
    <!-- notes -->
    <rect x="560" y="474" width="290" height="76" rx="6" fill="#15151C" stroke="#FFE500" stroke-width="2"/>
    <text x="705" y="508">Connect AI reads the record</text>
    <text x="705" y="528">again, live</text>
    <rect x="560" y="672" width="290" height="86" rx="6" fill="#15151C" stroke="#FFE500" stroke-width="2"/>
    <text x="705" y="699">after a few kills, one</text>
    <text x="705" y="719">Connect AI check in another</text>
    <text x="705" y="739">app, free</text>
    <text x="490" y="187" font-size="13" fill="#B5B9BC" text-anchor="start">pick up a keycard for each door</text>
    <!-- edge labels -->
    <g font-size="13" fill="#B5B9BC" text-anchor="start">
      <text x="342" y="352">arrived</text>
      <text x="480" y="262">Blocked: monsters in the way</text>
      <text x="514" y="502" text-anchor="middle">killed</text>
      <text x="150" y="620" text-anchor="middle">no</text>
      <text x="342" y="702">yes</text>
      <text x="342" y="848">no</text>
      <text x="100" y="770" text-anchor="middle">yes</text>
      <text x="342" y="942">won't open</text>
    </g>
    <text x="440" y="1050" font-size="14" fill="#B5B9BC">Every look, go_to and attack costs 1 of 100 moves. Connect AI calls are free.</text>
  </g>
</svg>
