<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 890" role="img" aria-labelledby="t1 d1">
  <title id="t1">Claude Code talks MCP to two servers</title>
  <desc id="d1">Two panels. Before the game, Claude Code asks the Connect AI MCP server, which reads your apps, and produces rooms, records, permissions and refusals that a map builder turns into a Doom level. While you play, Claude Code uses the Doom MCP server tools look, go_to and attack. Doom only touches local files, and a bridge that is an MCP client is the only part in the game talking to Connect AI.</desc>
  <defs>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#777577"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#777577"/></marker>
  </defs>
  <rect width="880" height="890" fill="#0b0f1c"/>
  <g font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#F1EEE9" text-anchor="middle">
    <!-- Panel A -->
    <rect x="10" y="10" width="860" height="335" rx="10" fill="#0e1424" stroke="#3a3a3a"/>
    <text x="30" y="44" font-size="17" font-weight="600" text-anchor="start">Before the game: Claude builds the level</text>
    <rect x="30" y="70" width="250" height="60" rx="30" fill="#111827" stroke="#B5B9BC" stroke-dasharray="5 4"/>
    <text x="155" y="105">What did I work on yesterday?</text>
    <line x1="280" y1="100" x2="318" y2="100" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <rect x="320" y="70" width="150" height="60" rx="6" fill="#111827" stroke="#F1EEE9" stroke-width="2"/>
    <text x="395" y="105" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">Claude Code</text>
    <line x1="470" y1="100" x2="548" y2="100" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <text x="510" y="88" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#FFE500">MCP</text>
    <rect x="550" y="65" width="300" height="70" rx="6" fill="#15151C" stroke="#FFE500" stroke-width="2"/>
    <text x="700" y="94" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700" fill="#FFE500">Connect AI MCP server</text>
    <text x="700" y="118" font-size="13" fill="#B5B9BC">read-only tools</text>
    <line x1="700" y1="135" x2="700" y2="178" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <text x="712" y="162" font-size="13" fill="#B5B9BC" text-anchor="start">your apps</text>
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="13">
      <rect x="550" y="180" width="90" height="32" rx="4" fill="#111827" stroke="#3a3a3a"/><text x="595" y="201">Salesforce</text>
      <rect x="655" y="180" width="90" height="32" rx="4" fill="#111827" stroke="#3a3a3a"/><text x="700" y="201">Zendesk</text>
      <rect x="760" y="180" width="90" height="32" rx="4" fill="#111827" stroke="#3a3a3a"/><text x="805" y="201">Stripe</text>
    </g>
    <line x1="340" y1="130" x2="340" y2="248" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <text x="352" y="195" font-size="13" fill="#B5B9BC" text-anchor="start">then produces</text>
    <rect x="60" y="250" width="300" height="60" rx="6" fill="#111827" stroke="#B5B9BC"/>
    <text x="210" y="285">rooms, records, permissions, refusals</text>
    <line x1="360" y1="280" x2="408" y2="280" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <rect x="410" y="250" width="150" height="60" rx="6" fill="#111827" stroke="#F1EEE9"/>
    <text x="485" y="285" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">map builder</text>
    <line x1="560" y1="280" x2="608" y2="280" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <rect x="610" y="250" width="180" height="60" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/>
    <text x="700" y="285" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">Doom level</text>

    <!-- Panel B -->
    <rect x="10" y="360" width="860" height="520" rx="10" fill="#0e1424" stroke="#3a3a3a"/>
    <text x="30" y="394" font-size="17" font-weight="600" text-anchor="start">While you play: Claude plays it</text>
    <rect x="30" y="440" width="170" height="50" rx="6" fill="#111827" stroke="#F1EEE9" stroke-width="2"/>
    <text x="115" y="470" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">Claude Code</text>
    <line x1="200" y1="465" x2="288" y2="465" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <text x="245" y="453" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#FFE500">MCP</text>
    <rect x="290" y="415" width="310" height="100" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/>
    <text x="445" y="441" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">Doom MCP server</text>
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="14">
      <rect x="310" y="455" width="80" height="34" rx="4" fill="#111827" stroke="#E8290B"/><text x="350" y="477">look</text>
      <rect x="405" y="455" width="80" height="34" rx="4" fill="#111827" stroke="#E8290B"/><text x="445" y="477">go_to</text>
      <rect x="500" y="455" width="80" height="34" rx="4" fill="#111827" stroke="#E8290B"/><text x="540" y="477">attack</text>
    </g>
    <line x1="445" y1="517" x2="445" y2="578" stroke="#777577" stroke-width="2" marker-start="url(#as)" marker-end="url(#ae)"/>
    <text x="462" y="553" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#B5B9BC" text-anchor="start">command file in, state.json out</text>
    <rect x="290" y="580" width="310" height="60" rx="6" fill="#15151C" stroke="#E8290B" stroke-width="2"/>
    <text x="445" y="615" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">Doom (patched psdoom-ng)</text>
    <line x1="445" y1="642" x2="445" y2="698" stroke="#777577" stroke-width="2" marker-start="url(#as)" marker-end="url(#ae)"/>
    <text x="462" y="675" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#B5B9BC" text-anchor="start">local files only</text>
    <rect x="290" y="700" width="310" height="70" rx="6" fill="#111827" stroke="#FFE500" stroke-width="2"/>
    <text x="445" y="729" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">bridge</text>
    <text x="445" y="752" font-size="13" fill="#B5B9BC">(an MCP client)</text>
    <line x1="600" y1="735" x2="678" y2="735" stroke="#777577" stroke-width="2" marker-end="url(#ae)"/>
    <text x="640" y="723" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#FFE500">MCP</text>
    <rect x="680" y="700" width="170" height="70" rx="6" fill="#15151C" stroke="#FFE500" stroke-width="2"/>
    <text x="765" y="731" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700" fill="#FFE500">Connect AI</text>
    <text x="765" y="752" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700" fill="#FFE500">MCP server</text>
    <line x1="765" y1="770" x2="765" y2="798" stroke="#777577" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="30" y="800" width="820" height="50" rx="6" fill="#111827" stroke="#FFE500" stroke-dasharray="5 4"/>
    <text x="440" y="830">re-runs each room's query every 15 s, re-reads kills, re-asks at the red door</text>
    <g fill="#B5B9BC" text-anchor="start">
      <text x="30" y="590">The game only touches</text>
      <text x="30" y="610">local files. The bridge is</text>
      <text x="30" y="630">the only part of it that</text>
      <text x="30" y="650">talks to Connect AI.</text>
    </g>
  </g>
</svg>
