<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-label="The doorbell automation: when the doorbell camera sees a person at the front door for 10 to 60 seconds without a ring, Home Assistant sends a snapshot to an AI task (ai_task.generate_data with qwen3-vl:8b on Ollama). If there’s a package or nobody is home, it pushes an alert with the snapshot; otherwise it stays quiet. If the AI errors, it carries on as if there’s a package.">
