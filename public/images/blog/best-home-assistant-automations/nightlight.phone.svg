<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="The Great Room nightlight, decoded. Red: the garage has been open more than an hour, a door was left open late, there's a water leak or smoke, or the homelab is down. Orange: the washer finished. Blue, breathing: it just started raining. Its normal glow: everything is fine, go to bed.">
