<circle cx="42" cy="266" r="15" fill="#2f7bff"/>
<text x="70" y="266" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="20" fill="#ededed" text-anchor="start" dominant-baseline="central">BLUE</text>
<text x="128" y="267" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">breathing</text>
<text x="70" y="290" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="15" fill="#ededed" text-anchor="start" dominant-baseline="central">it just started raining</text>
<circle cx="42" cy="332" r="15" fill="#ece6da"/>
<text x="70" y="332" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="20" fill="#ededed" text-anchor="start" dominant-baseline="central">NORMAL</text>
<text x="70" y="356" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="15" fill="#ededed" text-anchor="start" dominant-baseline="central">everything is fine, go to bed</text>
<text x="16" y="404" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Three colours, so I never have to look one up.</text>
