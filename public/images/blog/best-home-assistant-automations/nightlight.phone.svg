<text x="20" y="21" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="17" fill="#ece6da" text-anchor="start" dominant-baseline="central">GREAT ROOM NIGHTLIGHT</text>
<circle cx="42" cy="68" r="15" fill="#ff3b30"/>
<text x="70" y="68" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="20" fill="#ededed" text-anchor="start" dominant-baseline="central">RED</text>
<text x="70" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="15" fill="#ededed" text-anchor="start" dominant-baseline="central">garage open more than 1 hour</text>
