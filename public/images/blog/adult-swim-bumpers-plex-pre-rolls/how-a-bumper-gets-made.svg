<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="How a bumper gets made. Each bumper is a few lines in bumpers.yaml: two to four text cards, a background clip and a music track. bumper render runs ffmpeg and writes a ten-second MP4 with the cards fading through one at a time and [yourserver] as the last card. NeXroll, a self-hosted pre-roll manager, shuffles the MP4s, and Plex plays one before every movie on Joeflix. TV episodes start cold, because Plex only plays pre-rolls before movies.">
