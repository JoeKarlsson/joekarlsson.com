<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-label="Load-balanced partition placement. Availability group 1 holds nodes 1 and 3, and availability group 2 holds nodes 2 and 4. Each node has four master partitions and four replica partitions. Node 1 and node 2 replicate their masters to each other’s replicas, and so do node 3 and node 4, so every partition has a copy in the other availability group.">
