<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 820" width="360" height="820" role="img" aria-label="How the litter box works. The scale under the box keeps an average of its last 20 readings. When the average goes past the empty box plus a cat-sized weight, the box waits 10 seconds for the cat to settle, writes the cat's weight to MongoDB, and recalibrates the empty weight. Lifting the lid trips a magnetic switch, which logs a cleaning to MongoDB; putting it back waits 10 seconds and recalibrates.">
