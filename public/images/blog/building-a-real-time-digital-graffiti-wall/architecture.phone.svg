<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="The graffiti wall: a canvas UI in the browser (a 32 by 32 grid of divs, pointer events, optimistic updates) writes pixels through the MongoDB Realm SDK with anonymous auth to MongoDB Atlas, which holds 1,024 pixel documents, each with a color and an x, y coordinate. A microcontroller reads that pixel state and updates the WS2812B LED matrix on stage.">
