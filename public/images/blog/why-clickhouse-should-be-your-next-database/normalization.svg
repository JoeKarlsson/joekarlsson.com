<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Normalization versus denormalization, using a student’s grades. Normalized (OLTP): the student links to separate rows for each subject, Science B, English A, History B and Maths C, which suits looking up one grade. Denormalized (OLAP): all the grades sit together on one report card, History B, Maths C, English A and Science B, which suits analyzing many grades at once, the way ClickHouse works.">
