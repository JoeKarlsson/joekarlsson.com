<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" role="img" aria-label="Bar chart of the time to load the same dataset, both databases tuned: ClickHouse 507 seconds, PostgreSQL 11,800 seconds, 23 times longer.">
<defs></defs>
<rect width="360" height="180" fill="#000000"/>
<text x="8" y="20" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Seconds to load the dataset, both tuned.</text>
<text x="8" y="40" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">PostgreSQL takes 23x longer.</text>
