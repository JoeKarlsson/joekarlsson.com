<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="What a Claude Code mod does. Inside Claude Code, Claude is about to run a command, edit a file or answer. A mod sees it first and can stop it, change it, or let it through. The mod can also put things on your screen: a status line, a side panel, a pop-up and its own slash commands. Hooks could already stop Claude; they couldn’t show you anything.">
