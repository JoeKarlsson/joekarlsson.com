<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="360" height="700" role="img" aria-label="The common cache-layer approach: event streams, APIs and databases load into the data warehouse, an ETL job copies data into a cache like Redis, an ORM reads the cache, and an API serves the applications. Queries get fast, but the data is only as fresh as the last ETL run.">
