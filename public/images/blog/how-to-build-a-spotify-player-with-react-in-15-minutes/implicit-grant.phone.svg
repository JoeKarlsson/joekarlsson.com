<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 942" width="360" height="942" role="img" aria-label="The implicit grant flow for this player. The Login with Spotify link in the React app sends you to Spotify Accounts at /authorize with the client_id, scopes and response_type=token. You log in and approve the scopes. Spotify Accounts redirects you back to localhost:3000 with the access token in the URL hash. The app reads the token from window.location.hash; it is short-lived and has no refresh token. Then the app calls the Spotify Web API at /v1/me/player with the token as a Bearer header and gets back JSON about what is playing.">
