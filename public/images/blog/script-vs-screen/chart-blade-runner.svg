<text x="16" y="20" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="22" fill="#ededed" text-anchor="start" dominant-baseline="central">BLADE RUNNER'S LAST SCENE, ON THE PAGE AND ON SCREEN</text>
<text x="26" y="68" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">The script: Hampton Fancher's draft</text>
<text x="326" y="68" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">The film: what the subtitles say</text>
<g class="anim-live"><text x="26" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="109" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">It's time to die.</text><rect x="59" y="117" height="3" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;76" keyTimes="0.0000;0.0833" dur="10s" fill="freeze"/></rect><rect x="26" y="108" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;30" keyTimes="0.0000;0.0833" dur="10s" fill="freeze"/></rect><text x="26" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Deckard throws the laser at him. It</text><rect x="26" y="135" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;54.2;108.3;162.5;216.7;227.5" keyTimes="0.0000;0.1583;0.1667;0.1750;0.1833;0.1917" dur="10s" fill="freeze"/></rect><text x="26" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">misses. Batty throws his head back</text><rect x="26" y="154" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;52.6;105.2;157.9;210.5;221" keyTimes="0.0000;0.1583;0.1667;0.1750;0.1833;0.1917" dur="10s" fill="freeze"/></rect><text x="26" y="174" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">and laughs.</text><rect x="26" y="173" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;17;34;51.1;68.1;71.5" keyTimes="0.0000;0.1583;0.1667;0.1750;0.1833;0.1917" dur="10s" fill="freeze"/></rect><text x="26" y="201" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="218" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">That's for you. Stick it in your ear</text><rect x="26" y="217" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;33.9;90.5;147.1;203.7;237.6" keyTimes="0.0000;0.2250;0.2333;0.2417;0.2500;0.2583" dur="10s" fill="freeze"/></rect><text x="26" y="237" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">and push. If that doesn't work, try</text><rect x="26" y="236" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;33;88;143;198;231" keyTimes="0.0000;0.2250;0.2333;0.2417;0.2500;0.2583" dur="10s" fill="freeze"/></rect><text x="26" y="256" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">the eye.</text><rect x="26" y="255" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;7.5;20.1;32.7;45.3;52.8" keyTimes="0.0000;0.2250;0.2333;0.2417;0.2500;0.2583" dur="10s" fill="freeze"/></rect><text x="26" y="283" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Deckard FIRES again. This one goes</text><rect x="26" y="282" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;10.5;63.1;115.8;168.4;221" keyTimes="0.0000;0.2917;0.3000;0.3083;0.3167;0.3250" dur="10s" fill="freeze"/></rect><text x="26" y="302" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">home. Batty falls like he was</text><rect x="26" y="301" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;9;53.9;98.7;143.6;188.5" keyTimes="0.0000;0.2917;0.3000;0.3083;0.3167;0.3250" dur="10s" fill="freeze"/></rect><text x="26" y="321" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">poleaxed.</text><rect x="26" y="320" height="2.5" fill="#ff4fd8" width="0"><animate attributeName="width" calcMode="discrete" values="0;2.8;16.7;30.6;44.6;58.5" keyTimes="0.0000;0.2917;0.3000;0.3083;0.3167;0.3250" dur="10s" fill="freeze"/></rect><text x="326" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.3833" dur="10s" fill="freeze"/>I've seen things you people wouldn't</text><text x="326" y="111" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.3833" dur="10s" fill="freeze"/>believe.</text><text x="326" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.4417" dur="10s" fill="freeze"/>Attack ships on fire off the</text><text x="326" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.4417" dur="10s" fill="freeze"/>shoulder of Orion.</text><text x="326" y="180" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5000" dur="10s" fill="freeze"/>I watched C-beams glitter in the</text><text x="326" y="199" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5000" dur="10s" fill="freeze"/>dark near the Tannhäuser Gate.</text><text x="326" y="224" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5667" dur="10s" fill="freeze"/>All those moments will be lost in</text><text x="326" y="243" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5667" dur="10s" fill="freeze"/>time like tears in the rain.</text><text x="326" y="268" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="start" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.6250" dur="10s" fill="freeze"/>Time to die.</text><text x="26" y="354" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" fill="#a3a3a3" dominant-baseline="central" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7000" dur="10s" fill="freeze"/>Pink: the only words of the draft said on screen.</text></g>
<g class="anim-still" display="none"><text x="26" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="109" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">It's time to die.</text><rect x="59" y="117" height="3" fill="#ff4fd8" width="76"></rect><rect x="26" y="108" height="2.5" fill="#ff4fd8" width="30"></rect><text x="26" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Deckard throws the laser at him. It</text><rect x="26" y="135" height="2.5" fill="#ff4fd8" width="227.5"></rect><text x="26" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">misses. Batty throws his head back</text><rect x="26" y="154" height="2.5" fill="#ff4fd8" width="221"></rect><text x="26" y="174" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">and laughs.</text><rect x="26" y="173" height="2.5" fill="#ff4fd8" width="71.5"></rect><text x="26" y="201" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="218" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">That's for you. Stick it in your ear</text><rect x="26" y="217" height="2.5" fill="#ff4fd8" width="237.6"></rect><text x="26" y="237" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">and push. If that doesn't work, try</text><rect x="26" y="236" height="2.5" fill="#ff4fd8" width="231"></rect><text x="26" y="256" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">the eye.</text><rect x="26" y="255" height="2.5" fill="#ff4fd8" width="52.8"></rect><text x="26" y="283" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Deckard FIRES again. This one goes</text><rect x="26" y="282" height="2.5" fill="#ff4fd8" width="221"></rect><text x="26" y="302" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">home. Batty falls like he was</text><rect x="26" y="301" height="2.5" fill="#ff4fd8" width="188.5"></rect><text x="26" y="321" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">poleaxed.</text><rect x="26" y="320" height="2.5" fill="#ff4fd8" width="58.5"></rect><text x="326" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I've seen things you people wouldn't</text><text x="326" y="111" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">believe.</text><text x="326" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">Attack ships on fire off the</text><text x="326" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">shoulder of Orion.</text><text x="326" y="180" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I watched C-beams glitter in the</text><text x="326" y="199" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">dark near the Tannhäuser Gate.</text><text x="326" y="224" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">All those moments will be lost in</text><text x="326" y="243" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">time like tears in the rain.</text><text x="326" y="268" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="start" dominant-baseline="central" opacity="1">Time to die.</text><text x="26" y="354" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" fill="#a3a3a3" dominant-baseline="central" opacity="1">Pink: the only words of the draft said on screen.</text></g>
