<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Blade Runner's ending, script against screen. In Hampton Fancher's draft, Batty says &quot;It's time to die,&quot; hands Deckard a nail (&quot;Stick it in your ear and push&quot;), and Deckard shoots him dead. In the film, Batty saves Deckard and says: I've seen things you people wouldn't believe. Attack ships on fire off the shoulder of Orion. I watched C-beams glitter in the dark near the Tannhäuser Gate. All those moments will be lost in time like tears in the rain. Time to die. Of the draft's lines, only &quot;time to die&quot; is said on screen.">
<defs></defs>
<rect width="640" height="380" fill="#000000"/>
