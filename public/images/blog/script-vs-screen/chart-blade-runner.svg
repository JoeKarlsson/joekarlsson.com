nt-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I've seen things you people wouldn't</text><text x="326" y="111" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">believe.</text><text x="326" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">Attack ships on fire off the</text><text x="326" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">shoulder of Orion.</text><text x="326" y="180" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I watched C-beams glitter in the</text><text x="326" y="199" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">dark near the Tannhäuser Gate.</text><text x="326" y="224" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">All those moments will be lost in</text><text x="326" y="243" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">time like tears in the rain.</text><text x="326" y="268" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="start" d