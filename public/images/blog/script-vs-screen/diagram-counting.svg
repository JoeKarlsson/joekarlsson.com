<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="How each film is scored, on one line from Blade Runner. The script has Pris say &quot;I have some, but I have to find out where they are staying.&quot; The subtitles, up to nine versions per film, have &quot;I have some, but I have to find them.&quot; Lined up word by word in order, 8 of the script's 13 words are said; a word counts only if most subtitle versions have it. A film's score is the share of all its script's dialogue words said this way: Blade Runner's is 19%.">
