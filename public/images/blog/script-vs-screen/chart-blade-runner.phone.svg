<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610" role="img" aria-label="Blade Runner's ending, script against screen. In Hampton Fancher's draft, Batty says &quot;It's time to die,&quot; hands Deckard a nail (&quot;Stick it in your ear and push&quot;), and Deckard shoots him dead. In the film, Batty saves Deckard and says: I've seen things you people wouldn't believe. Attack ships on fire off the shoulder of Orion. I watched C-beams glitter in the dark near the Tannhäuser Gate. All those moments will be lost in time like tears in the rain. Time to die. Of the draft's lines, only &quot;time to die&quot; is said on screen.">
<defs></defs>
<rect width="360" height="610" fill="#000000"/>
<path class="d-paper" d="M6,46.6 L20,48 L34,45.1 L48,44.7 L62,47.8 L76,45.3 L90,44.5 L104,47.5 L118,44.1 L132,45.2 L146,43.9 L160,45.2 L174,47.3 L188,44.9 L202,46.5 L216,43.6 L230,43.6 L244,45.1 L258,45.4 L272,47.4 L286,45.1 L300,46.6 L314,46.5 L328,44 L342,43.5 L355.4,46 L352.1,60 L353.9,74 L354.4,88 L351.7,102 L356,116 L352.9,130 L352.1,144 L354,158 L354.5,172 L353,186 L356,200 L353,214 L354.7,228 L353.1,242 L356.2,256 L351.7,270 L353.8,284 L355,298 L355.3,312 L352.9,326 L353.1,340 L353.9,354 L354.4,368 L353.3,382 L352.3,396 L354.8,410 L355.2,424 L355,438 L352.8,452 L355.6,466 L351.5,480 L352.7,494 L355.9,508 L356,522 L353.5,536 L355.7,550 L355.1,564 L356.2,578 L352.4,592 L354,604.6 L340,602.8 L326,603.4 L312,603.6 L298,605.9 L284,603.5 L270,605.3 L256,603.6 L242,604.7 L228,603.6 L214,602.6 L200,604.6 L186,602.7 L172,605.2 L158,606.3 L144,605.6 L130,604.2 L116,605.1 L102,605.7 L88,602.1 L74,604.2 L60,604.2 L46,603.6 L32,604.4 L18,603.6 L8.4,604 L5.6,590 L6.5,576 L6.2,562 L5.4,548 L4.4,534 L6.7,520 L7.1,506 L5.6,492 L7,478 L6.5,464 L7.6,450 L5.4,436 L6.3,422 L4.2,408 L6.4,394 L8.1,380 L4.1,366 L7.2,352 L4.4,338 L6.7,324 L7.3,310 L3.9,296 L8.2,282 L3.6,268 L4.5,254 L4.9,240 L3.9,226 L4.9,212 L6.6,198 L3.7,184 L6.5,170 L5.9,156 L4.6,142 L6.2,128 L6.9,114 L8.1,100 L7.6,86 L8,72 L8.2,58 Z" fill="#151515" stroke="#ece6da" stroke-width="2" transform="rotate(-0.4 180 325)"/>
<text x="20" y="18" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="19" fill="#ededed" text-anchor="start" dominant-baseline="central">BLADE RUNNER'S LAST SCENE</text>
<text x="26" y="68" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">The script: Hampton Fancher's draft</text>
<text x="26" y="348" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">The film: what the subtitles say</text>
<text x="26" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="109" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" dominant-baseline="central" textLength="24" lengthAdjust="spacing">It's</text><text x="54" y="109" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" dominant-baseline="central" textLength="76" lengthAdjust="spacing">time to die.</text><rect x="54" y="117" height="3" fill="#ff4fd8" width="76"></rect><rect x="26" y="108" height="2.5" fill="#ff4fd8" width="24"></rect><text x="26" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" dominant-baseline="central" textLength="227.5" lengthAdjust="spacing">Deckard throws the laser at him. It</text><rect x="26" y="135" height="2.5" fill="#ff4fd8" width="227.5"></rect><text x="26" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" dominant-baseline="central" textLength="247" lengthAdjust="spacing">misses. Batty throws his head back and</text><rect x="26" y="154" height="2.5" fill="#ff4fd8" width="247"></rect><text x="26" y="174" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" dominant-baseline="central" textLength="45.5" lengthAdjust="spacing">laughs.</text><rect x="26" y="173" height="2.5" fill="#ff4fd8" width="45.5"></rect><text x="26" y="201" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="218" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" dominant-baseline="central" textLength="264" lengthAdjust="spacing">That's for you. Stick it in your ear and</text><rect x="26" y="217" height="2.5" fill="#ff4fd8" width="264"></rect><text x="26" y="237" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" dominant-baseline="central" textLength="264" lengthAdjust="spacing">push. If that doesn't work, try the eye.</text><rect x="26" y="236" height="2.5" fill="#ff4fd8" width="264"></rect><text x="26" y="264" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" dominant-baseline="central" textLength="260" lengthAdjust="spacing">Deckard FIRES again. This one goes home.</text><rect x="26" y="263" height="2.5" fill="#ff4fd8" width="260"></rect><text x="26" y="283" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" dominant-baseline="central" textLength="214.5" lengthAdjust="spacing">Batty falls like he was poleaxed.</text><rect x="26" y="282" height="2.5" fill="#ff4fd8" width="214.5"></rect><text x="26" y="372" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I've seen things you people wouldn't</text><text x="26" y="391" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">believe.</text><text x="26" y="416" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">Attack ships on fire off the shoulder of</text><text x="26" y="435" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">Orion.</text><text x="26" y="460" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I watched C-beams glitter in the dark</text><text x="26" y="479" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">near the Tannhäuser Gate.</text><text x="26" y="504" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">All those moments will be lost in time</text><text x="26" y="523" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">like tears in the rain.</text><text x="26" y="548" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="start" dominant-baseline="central" opacity="1">Time to die.</text>
<g class="jk-mark" opacity="0.4" aria-hidden="true" transform="translate(315.81 562.53) scale(0.186)"><path d="M26.59 100.91 Q19.83 100.91 14.26 98.3 Q8.69 95.68 5.43 90.54 Q2.16 85.4 2.16 77.9 L2.16 52.84 L21.93 52.84 L21.93 76.7 Q21.93 79.32 22.98 80.91 Q24.03 82.5 26.36 82.5 Q30.85 82.5 30.85 76.99 L30.85 0 L51.02 0 L51.02 75 Q51.02 82.95 47.9 88.78 Q44.77 94.6 39.26 97.76 Q33.75 100.91 26.59 100.91 Z M58.69 100 L58.69 0 L78.47 0 L78.47 40.06 L87.78 0 L107.9 0 L96.7 45.8 L110.23 100 L89.49 100 L78.58 51.59 L78.58 100 Z" fill="#ff4fd8"/><path d="M26.59 100.91 Q19.83 100.91 14.26 98.3 Q8.69 95.68 5.43 90.54 Q2.16 85.4 2.16 77.9 L2.16 52.84 L21.93 52.84 L21.93 76.7 Q21.93 79.32 22.98 80.91 Q24.03 82.5 26.36 82.5 Q30.85 82.5 30.85 76.99 L30.85 0 L51.02 0 L51.02 75 Q51.02 82.95 47.9 88.78 Q44.77 94.6 39.26 97.76 Q33.75 100.91 26.59 100.91 Z M58.69 100 L58.69 0 L78.47 0 L78.47 40.06 L87.78 0 L107.9 0 L96.7 45.8 L110.23 100 L89.49 100 L78.58 51.59 L78.58 100 Z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" transform="translate(-5.6 -4.5)"/></g></svg>
