<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="Blade Runner's ending, script against screen. In Hampton Fancher's draft, Batty says &quot;It's time to die,&quot; hands Deckard a nail (&quot;Stick it in your ear and push&quot;), and Deckard shoots him dead. In the film, Batty saves Deckard and says: I've seen things you people wouldn't believe. Attack ships on fire off the shoulder of Orion. I watched C-beams glitter in the dark near the Tannhäuser Gate. All those moments will be lost in time like tears in the rain. Time to die. Of the draft's lines, only &quot;time to die&quot; is said on screen.">
<defs></defs>
<rect width="360" height="640" fill="#000000"/>
<path class="d-paper" d="M6,46.6 L20,48 L34,45.1 L48,44.7 L62,47.8 L76,45.3 L90,44.5 L104,47.5 L118,44.1 L132,45.2 L146,43.9 L160,45.2 L174,47.3 L188,44.9 L202,46.5 L216,43.6 L230,43.6 L244,45.1 L258,45.4 L272,47.4 L286,45.1 L300,46.6 L314,46.5 L328,44 L342,43.5 L355.4,46 L352.1,60 L353.9,74 L354.4,88 L351.7,102 L356,116 L352.9,130 L352.1,144 L354,158 L354.5,172 L353,186 L356,200 L353,214 L354.7,228 L353.1,242 L356.2,256 L351.7,270 L353.8,284 L355,298 L355.3,312 L352.9,326 L353.1,340 L353.9,354 L354.4,368 L353.3,382 L352.3,396 L354.8,410 L355.2,424 L355,438 L352.8,452 L355.6,466 L351.5,480 L352.7,494 L355.9,508 L356,522 L353.5,536 L355.7,550 L355.1,564 L356.2,578 L352.4,592 L354.6,606 L352.8,620 L354,633.4 L340,633.6 L326,635.9 L312,633.5 L298,635.3 L284,633.6 L270,634.7 L256,633.6 L242,632.6 L228,634.6 L214,632.7 L200,635.2 L186,636.3 L172,635.6 L158,634.2 L144,635.1 L130,635.7 L116,632.1 L102,634.2 L88,634.2 L74,633.6 L60,634.4 L46,633.6 L32,636.4 L18,633.6 L6.5,634 L6.2,620 L5.4,606 L4.4,592 L6.7,578 L7.1,564 L5.6,550 L7,536 L6.5,522 L7.6,508 L5.4,494 L6.3,480 L4.2,466 L6.4,452 L8.1,438 L4.1,424 L7.2,410 L4.4,396 L6.7,382 L7.3,368 L3.9,354 L8.2,340 L3.6,326 L4.5,312 L4.9,298 L3.9,284 L4.9,270 L6.6,256 L3.7,242 L6.5,228 L5.9,214 L4.6,200 L6.2,186 L6.9,172 L8.1,158 L7.6,144 L8,130 L8.2,116 L5.2,102 L5.4,88 L5.4,74 L7.4,60 Z" fill="#151515" stroke="#ece6da" stroke-width="2" transform="rotate(-0.4 180 340)"/>
<text x="20" y="18" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="19" fill="#ededed" text-anchor="start" dominant-baseline="central">BLADE RUNNER'S LAST SCENE</text>
<text x="26" y="68" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">The script: Hampton Fancher's draft</text>
<text x="26" y="348" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">The film: what the subtitles say</text>
<text x="26" y="92" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="109" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">It's time to die.</text><rect x="59" y="117" height="3" fill="#ff4fd8" width="76"></rect><rect x="26" y="108" height="2.5" fill="#ff4fd8" width="30"></rect><text x="26" y="136" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Deckard throws the laser at him. It</text><rect x="26" y="135" height="2.5" fill="#ff4fd8" width="227.5"></rect><text x="26" y="155" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">misses. Batty throws his head back and</text><rect x="26" y="154" height="2.5" fill="#ff4fd8" width="247"></rect><text x="26" y="174" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">laughs.</text><rect x="26" y="173" height="2.5" fill="#ff4fd8" width="45.5"></rect><text x="26" y="201" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" font-weight="700" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">BATTY</text><text x="26" y="218" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">That's for you. Stick it in your ear and</text><rect x="26" y="217" height="2.5" fill="#ff4fd8" width="264"></rect><text x="26" y="237" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="start" dominant-baseline="central">push. If that doesn't work, try the eye.</text><rect x="26" y="236" height="2.5" fill="#ff4fd8" width="264"></rect><text x="26" y="264" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Deckard FIRES again. This one goes home.</text><rect x="26" y="263" height="2.5" fill="#ff4fd8" width="260"></rect><text x="26" y="283" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start" dominant-baseline="central">Batty falls like he was poleaxed.</text><rect x="26" y="282" height="2.5" fill="#ff4fd8" width="214.5"></rect><text x="26" y="372" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I've seen things you people wouldn't</text><text x="26" y="391" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">believe.</text><text x="26" y="416" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">Attack ships on fire off the shoulder of</text><text x="26" y="435" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">Orion.</text><text x="26" y="460" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">I watched C-beams glitter in the dark</text><text x="26" y="479" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">near the Tannhäuser Gate.</text><text x="26" y="504" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">All those moments will be lost in time</text><text x="26" y="523" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="400" fill="#ededed" text-anchor="start" dominant-baseline="central" opacity="1">like tears in the rain.</text><text x="26" y="548" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4fd8" text-anchor="start" dominant-baseline="central" opacity="1">Time to die.</text><text x="26" y="614" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="13" fill="#a3a3a3" dominant-baseline="central" opacity="1">Pink: the only words of the draft said on screen.</text>
</svg>
