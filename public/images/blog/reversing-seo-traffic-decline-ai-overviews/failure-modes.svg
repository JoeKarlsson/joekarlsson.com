<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Two failure modes behind falling clicks, told apart by position. Failure mode 1: position and impressions up, clicks flat or down, the AI Overview signature. The fix is GEO and CTR work: FAQ schema, quotable definitions, structured data, and title and meta rewrites. Failure mode 2: position and clicks both down, a quality or authority problem. The fix is content quality, internal links, redirect cleanup and backlinks. Most SEO recovery advice only covers failure mode 2.">
