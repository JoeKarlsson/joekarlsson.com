<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Which MongoDB security feature stops which attack. Role-based access control stops database privilege abuse, such as stolen credentials. TLS/SSL transport encryption stops network snooping, such as packet sniffing. Encryption at rest stops data theft, such as stolen disks. Client-side field level encryption (CSFLE) stops all four, including reading the database host’s memory, because sensitive fields stay encrypted on the host and in transit and only the client holds the keys.">
<defs></defs>
<rect width="640" height="340" fill="#000000"/>
<text x="232" y="24" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="18" fill="#ededed" text-anchor="middle" dominant-baseline="central">RBAC</text>
<text x="232" y="44" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">role-based access</text>
<text x="344" y="24" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="18" fill="#ededed" text-anchor="middle" dominant-baseline="central">TLS/SSL</text>
<text x="344" y="44" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">in transit</text>
<text x="456" y="24" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="18" fill="#ededed" text-anchor="middle" dominant-baseline="central">AT REST</text>
<text x="456" y="44" font-family="var(--font-hanken-grotesk, 'Hanken Grotesk'), Arial, sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle" dominant-baseline="central">encrypted disks</text>
<text x="568" y="24" font-family="var(--font-anton, Anton), Impact, sans-serif" font-size="18" fill="#ff4fd8" text-anchor="middle" dominant-baseline="central">CSFLE</text>
