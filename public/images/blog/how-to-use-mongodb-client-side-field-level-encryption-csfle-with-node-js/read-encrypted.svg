<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-label="Reading encrypted fields, in order: mongocryptd validates the query against the automatic encryption configuration (a JSON Schema), the client queries the MongoDB data collection and gets back results with encrypted fields, fetches the data encryption keys from the key vault collection, has the KMS provider decrypt those keys, and then decrypts the fields itself with the data keys.">
