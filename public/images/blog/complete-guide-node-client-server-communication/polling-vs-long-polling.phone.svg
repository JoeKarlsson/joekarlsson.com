<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Polling versus long polling. With polling, the client sends GET /poll on a fixed interval, so an update that lands on the server waits until the next poll to reach the client. With long polling (Comet), the client sends GET /comet and the server holds the request open until it has an update, answers right away, and the client immediately asks again.">
