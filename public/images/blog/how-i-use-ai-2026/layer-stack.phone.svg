<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="My AI setup as a stack of six layers, from the top: always-on rules (&quot;Don't hide failures&quot;), knowledge read on demand (design rules, read before building a page), skills (the health check, decommissioning a service), subagents (reviewers who never compare notes), memory and decisions (&quot;Never swap the site font unasked&quot;) and, at the bottom in pink, hooks (no writes inside an immutable container). An arrow down the side says a rule that keeps failing moves down a layer.">
