<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="Dot and interval chart: the share of the 1700-49 to 1900-49 drop in sentence length that disappears when semicolons and colons count as sentence ends, measured eleven ways with 95% bootstrap intervals. Weighted by the hand-coded glue rate: 38% (28 to 48). Weighted with a strict sentence splitter: 42%. Semicolons only: 42%. Dashes counted too: 43%. Base count: 47% (38 to 60). Plays and poetry removed: 48%. English originals: 48%. Measured from 1750-99: 49%. Strict sentence splitter: 52%. Narration only: 54%. English originals by both checks: 58% (50 to 61). Every estimate lands between 38% and 58%; a line marks about 40%.">
