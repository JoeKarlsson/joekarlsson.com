<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Line chart of median words between stops (periods, question marks, exclamation marks, semicolons and colons), by 50-year period from 1700-49 to 1950-74, in the 883 deduplicated books that still have a full text. Narration alone, with every quoted word removed, falls from 21.9 words in 1700-49 to 14.6 in 1900-49. All the text falls from 21.9 to 13.3. The two lines fall together, so sentences got shorter outside dialogue too. 1700-49 has only 16 books and 1950-74 only 17, where narration sits at 14.9 and all the text at 13.2.">
