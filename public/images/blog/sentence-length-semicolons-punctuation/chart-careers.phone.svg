<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" role="img" aria-label="Seventeen authors with five or more dated books spanning 20 or more years, each drawn as a line from the fitted semicolon rate of their first book to their last, over the median book of the whole shelf by 25-year period. Eight fall and nine rise. Dickens falls from 11.8 to 5.6 semicolons per 1,000 words (1836-1870), Henry James from 12.4 to 6.8; Jane Austen rises from 6.0 to 15.5 and Mark Twain from 8.6 to 13.6. In a model of 748 English-original books from 1750 to 1974 with both, publication year accounts for -3.1 semicolons per 1,000 words per century (95% interval -6.2 to -0.02, resampling authors) and author birth year for -3.7 (-6.7 to -0.7). The intervals overlap, so the model cannot say which matters more.">
