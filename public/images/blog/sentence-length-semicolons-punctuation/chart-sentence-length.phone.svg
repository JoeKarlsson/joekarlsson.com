<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-label="Line chart of median sentence length in 954 dated Project Gutenberg books, by 50-year period from 1600 to 1974. Counting only periods, question marks and exclamation marks as sentence ends, sentences peak at 30.3 words in 1700-49 and fall to 14.5 in 1900-49 and 12.5 in 1950-74. Counting semicolons and colons as stops too, the second line runs from 21.6 in 1700-49 to 13.3 in 1900-49, and the two lines meet at 12.4 in 1950-74. The gap between them, the glued sentences, is widest before 1800.">
