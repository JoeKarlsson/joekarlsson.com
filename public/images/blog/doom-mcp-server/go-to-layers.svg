<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 710" width="640" height="710" role="img" aria-label="What happens when Claude calls go_to. Claude calls go_to(&quot;Salesforce&quot;): it decides where to go and who to shoot, and never sees a pixel or a coordinate. It passes a name, nothing else, to play.py, the Doom MCP server, which plans the route (lobby, hall, stop at the door, turn 90 degrees, use, wait 1.2 s, walk in) because we built the level and it knows where every door is. Each waypoint is one MOVE x y command to psdoom-ng, the patched C engine, which steers 35 times a second: every tic it turns toward the next point, walks, and reports arrived within 16 units.">
<defs><filter id="doom-mcp-server-go-to-layers-desktop-crayon" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="750">
